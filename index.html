        function getSeasonGroupSummary(seasonId) {
            const groups = SEASON_GROUPS[seasonId];
            if (!groups || groups.length <= 1) return null;
            const labels = groups.map(g => g.label);
            let type;
            if (labels.some(l => l.startsWith('Act'))) type = 'Acts';
            else if (labels.some(l => l.startsWith('Ep.'))) type = 'Episodes';
            else if (labels.some(l => l.startsWith('Ch.'))) type = 'Chapters';
            else type = 'Parts';
            return { count: groups.length, type };
        }

        function computeSeasonPips(seasonId, stories, storyQuestCounts, useQuestLevel) {
            const groups = SEASON_GROUPS[seasonId];
            if (!groups || groups.length <= 1) return [];

            if (seasonId === MY_STORY_SEASON_ID) {
                const n = groups.length;
                return Array.from({length: n - 1}, (_, i) => ((i + 1) / n) * 100);
            }

            const totalItems = useQuestLevel
                ? stories.reduce((sum, s) => sum + (storyQuestCounts[s.id] || 0), 0)
                : stories.length;
            if (totalItems === 0) return [];

            const pips = [];
            let cumulative = 0;
            let storyIdx = 0;
            for (let g = 0; g < groups.length - 1; g++) {
                const count = groups[g].count;
                if (useQuestLevel) {
                    for (let i = 0; i < count && storyIdx < stories.length; i++, storyIdx++) {
                        cumulative += storyQuestCounts[stories[storyIdx].id] || 0;
                    }
                } else {
                    cumulative += count;
                    storyIdx += count;
                }
                pips.push((cumulative / totalItems) * 100);
            }
            return pips;
        }

        function computeGroupBoundaries(seasonId, stories, storyQuestCounts, useQuestLevel) {
            const groups = SEASON_GROUPS[seasonId];
            if (!groups) return [];

            if (seasonId === MY_STORY_SEASON_ID) {
                const n = groups.length;
                return groups.map((g, i) => ({ cumulative: Math.round(((i + 1) / n) * 49), label: g.label }));
            }

            const boundaries = [];
            let cumulative = 0;
            let storyIdx = 0;
            for (const group of groups) {
                if (useQuestLevel) {
                    for (let i = 0; i < group.count && storyIdx < stories.length; i++, storyIdx++) {
                        cumulative += storyQuestCounts[stories[storyIdx].id] || 0;
                    }
                } else {
                    cumulative += group.count;
                    storyIdx += group.count;
                }
                boundaries.push({ cumulative, label: group.label });
            }
            return boundaries;
        }

        function getCurrentGroupLabel(boundaries, progress, total) {
            if (!boundaries || boundaries.length === 0 || progress <= 0 || progress >= total) return null;
            for (const b of boundaries) {
                if (progress < b.cumulative) return b.label;
            }
            return null;
        }

        // --- gw2.me OAuth2 Configuration ---
        const GW2ME_CLIENT_ID = '3bb521a5-afec-4293-8186-e28bc86fe131';
        const GW2ME_REDIRECT_URI = window.location.origin + window.location.pathname;
        const GW2ME_SCOPES = 'gw2:account gw2:characters gw2:progression';
        const GW2ME_AUTH_URL = 'https://gw2.me/oauth2/authorize';
        const GW2ME_TOKEN_URL = 'https://gw2.me/api/token';
        const GW2ME_API_BASE = 'https://gw2.me/api';

        // --- PKCE Helpers ---
        function generateCodeVerifier() {
            const array = new Uint8Array(64);
            crypto.getRandomValues(array);
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            return Array.from(array, b => chars[b % chars.length]).join('');
        }

        async function deriveCodeChallenge(verifier) {
            const data = new TextEncoder().encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function generateState() {
            const array = new Uint8Array(24);
            crypto.getRandomValues(array);
            return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- gw2.me API Helpers ---
        async function getGw2meAccounts(accessToken) {
            const res = await fetch(`${GW2ME_API_BASE}/accounts`, {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            });
            if (!res.ok) throw new Error('Failed to fetch gw2.me accounts');
            const json = await res.json();
            return json.accounts;
        }

        async function getGw2meSubtoken(accessToken, accountId, { signal } = {}) {
            const res = await fetch(`${GW2ME_API_BASE}/accounts/${accountId}/subtoken`, {
                headers: { 'Authorization': `Bearer ${accessToken}` },
                signal
            });
            if (!res.ok) throw new Error('gw2.me session expired. Please log in again.');
            const json = await res.json();
            return json.subtoken;
        }

        function formatRelativeTime(ts) {
            const sec = Math.floor((Date.now() - ts) / 1000);
            if (sec < 60) return 'just now';
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min}m ago`;
            const hrs = Math.floor(min / 60);
            if (hrs < 24) return `${hrs}h ago`;
            return `${Math.floor(hrs / 24)}d ago`;
        }

        // --- Components ---

        const ProgressBar = ({ current, total, colorClass = "bg-gw2-gold", pips = [] }) => {
            const percentage = Math.min(100, Math.max(0, (current / total) * 100));
            return (
                <div className="w-full h-2 rounded-full progress-bar-bg overflow-hidden relative">
                    <div 
                        className={`h-full ${colorClass} transition-all duration-500`} 
                        style={{ width: `${percentage}%` }}
                    />
                    {pips.map((pos, i) => (
                        <div key={i}
                            className="absolute top-0 h-full w-px bg-white/30"
                            style={{ left: `${pos}%` }}
                        />
                    ))}
                </div>
            );
        };

        const CharacterRow = ({ charName, progress, total, unit = "Chapters", charInfo, onNavigate, pips, groupBoundaries, showPips = true }) => {
            const percentage = Math.round((progress / total) * 100);
            const isComplete = progress >= total;
            const hasProgress = progress > 0;
            const info = charInfo?.[charName];
            const groupLabel = getCurrentGroupLabel(groupBoundaries, progress, total);

            return (
                <div className="flex items-center justify-between p-2 rounded hover:bg-white/5">
                    <div className="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">
                        {info?.profession && PROFESSION_ICONS[info.profession]
                            ? <img src={PROFESSION_ICONS[info.profession]} alt={info.profession} className="w-6 h-6 sm:w-8 sm:h-8 shrink-0" />
                            : <User size={16} className="text-gray-500" />
                        }
                        <div className="flex flex-col min-w-0">
                            <span className="text-sm font-medium text-gray-300 truncate">
                                {onNavigate ? (
                                    <button onClick={() => onNavigate('character', charName)} className="hover:underline hover:text-gw2-gold-light transition-colors text-left">{charName}</button>
                                ) : charName}
                                {info && <span className="hidden sm:inline ml-1.5 text-xs text-gray-500 font-normal">Lv.{info.level} {info.race} {info.profession}</span>}
                            </span>
                            {info && <span className="text-xs text-gray-500 sm:hidden">Lv.{info.level} {info.race} {info.profession}</span>}
                            <span className="text-xs text-gray-500">
                                {progress} / {total} {unit} ({percentage}%)
                                {groupLabel && <span className="text-gray-600"> · {groupLabel}</span>}
                            </span>
                        </div>
                    </div>
                    <div className="w-16 sm:w-24 ml-2 sm:ml-4">
                        <ProgressBar current={progress} total={total} colorClass={isComplete ? "bg-green-500" : hasProgress ? "bg-gw2-gold" : "bg-gray-500"} pips={showPips ? pips : []} />
                    </div>
                </div>
            );
        };

        const SeasonCard = ({ season, characters, recommendedChar, charInfo, onNavigate, focusId, onNavigated, showPips = true, expandAllSignal }) => {
            const [expanded, setExpanded] = useState(false);
            const [highlight, setHighlight] = useState(false);
            const cardRef = useRef(null);

            useEffect(() => {
                if (expandAllSignal) setExpanded(expandAllSignal.expanded);
            }, [expandAllSignal]);
            
            useEffect(() => {
                if (focusId === season.id) {
                    setExpanded(true);
                    setHighlight(true);
                    setTimeout(() => {
                        cardRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                    setTimeout(() => setHighlight(false), 1500);
                    onNavigated?.();
                }
            }, [focusId, season.id, onNavigated]);

            const sortedChars = useMemo(() => {
                return Object.entries(characters)
                    .map(([name, data]) => ({ name, ...data }))
                    .sort((a, b) => {
                        if (a.name === recommendedChar?.name) return -1;
                        if (b.name === recommendedChar?.name) return 1;
                        return b.progress - a.progress;
                    });
            }, [characters, recommendedChar]);

            const isOwned = season.owned !== false;
            const isAllComplete = isOwned && sortedChars.length > 0 && sortedChars.every(c => c.progress >= c.total);
            const themeColor = STORY_COLORS[season.name];
            const groupSummary = getSeasonGroupSummary(season.id);

            const completedCount = isOwned ? sortedChars.filter(c => c.progress >= c.total).length : 0;
            const totalCharCount = sortedChars.length;
            const furthestIncomplete = useMemo(() => {
                if (!isOwned) return null;
                let best = null;
                for (const c of sortedChars) {
                    if (c.progress > 0 && c.progress < c.total) {
                        if (!best || c.progress > best.progress) best = c;
                    }
                }
                return best;
            }, [sortedChars, isOwned]);
            const furthestGroupLabel = furthestIncomplete
                ? getCurrentGroupLabel(season.groupBoundaries, furthestIncomplete.progress, furthestIncomplete.total)
                : null;

            const toggleExpanded = () => { if (isOwned) setExpanded(prev => !prev); };

            return (
                <div
                    ref={cardRef}
                    className={`card-bg rounded-lg border overflow-hidden mb-4 shadow-lg transition-all duration-700 scroll-mt-20 ${highlight ? 'border-gw2-gold ring-2 ring-gw2-gold/50' : 'border-stone-800'} ${!isOwned ? 'opacity-40' : ''}`}
                    style={themeColor ? { borderLeft: `4px solid ${themeColor}` } : undefined}
                >
                    <div
                        className={`p-3 sm:p-4 ${isOwned ? 'cursor-pointer' : ''}`}
                        style={themeColor
                            ? { background: `linear-gradient(to right, ${themeColor}30, transparent)` }
                            : { background: 'linear-gradient(to right, rgb(41 37 36), transparent)' }
                        }
                        onClick={toggleExpanded}
                    >
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2 sm:gap-3 min-w-0">
                                <BookOpen className={`shrink-0 ${completedCount > 0 ? "text-green-500" : isOwned ? "text-gw2-gold" : "text-gray-600"}`} size={24} />
                                <div className="min-w-0">
                                    <h3 className="text-base sm:text-lg font-bold text-gray-100 font-display truncate">{season.name}</h3>
                                    <p className="text-xs text-gray-400">
                                        {groupSummary && <>{groupSummary.count} {groupSummary.type} · </>}{season.totalStories} {season.unit || 'Chapters'}
                                    </p>
                                    {!isOwned ? (
                                        <p className="text-xs text-gray-500 italic mt-0.5">
                                            <Lock size={12} className="inline mr-1 align-text-bottom" />Requires {season.requiredExpansion}
                                        </p>
                                    ) : isAllComplete ? (
                                        <p className="text-xs text-green-400 mt-0.5">
                                            <CheckCircle2 size={12} className="inline mr-1 align-text-bottom" />Complete · {totalCharCount}/{totalCharCount} Characters
                                        </p>
                                    ) : completedCount > 0 ? (<>
                                        <p className="text-xs text-green-500/80 mt-0.5">
                                            <span className="text-green-400">{completedCount}</span>/{totalCharCount} Characters Completed
                                        </p>
                                        {furthestIncomplete && (() => {
                                            const fi = charInfo?.[furthestIncomplete.name];
                                            const pct = Math.round((furthestIncomplete.progress / furthestIncomplete.total) * 100);
                                            return (<>
                                                <p className="text-xs text-gray-400 mt-1">
                                                    <PlayCircle size={12} className="inline mr-1 align-text-bottom text-gw2-gold" /><span className="text-gw2-gold-light font-medium">{furthestIncomplete.name}</span>
                                                    {fi && <span className="text-gray-500"> · Lv.{fi.level} {fi.race} {fi.profession}</span>}
                                                </p>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <div className="w-24 sm:w-32">
                                                        <ProgressBar current={furthestIncomplete.progress} total={furthestIncomplete.total}
                                                            colorClass="bg-gw2-gold" pips={showPips ? season.pips : []} />
                                                    </div>
                                                    <span className="text-xs text-gray-500">
                                                        {furthestIncomplete.progress} / {furthestIncomplete.total} {season.unit || 'Chapters'} ({pct}%)
                                                    </span>
                                                </div>
                                            </>);
                                        })()}
                                    </>) : furthestIncomplete ? (() => {
                                        const fi = charInfo?.[furthestIncomplete.name];
                                        const pct = Math.round((furthestIncomplete.progress / furthestIncomplete.total) * 100);
                                        return (<>
                                            <p className="text-xs text-gray-400 mt-1">
                                                <PlayCircle size={12} className="inline mr-1 align-text-bottom text-gw2-gold" /><span className="text-gw2-gold-light font-medium">{furthestIncomplete.name}</span>
                                                {fi && <span className="text-gray-500"> · Lv.{fi.level} {fi.race} {fi.profession}</span>}
                                            </p>
                                            <div className="flex items-center gap-2 mt-1">
                                                <div className="w-24 sm:w-32">
                                                    <ProgressBar current={furthestIncomplete.progress} total={furthestIncomplete.total}
                                                        colorClass="bg-gw2-gold" pips={showPips ? season.pips : []} />
                                                </div>
                                                <span className="text-xs text-gray-500">
                                                    {furthestIncomplete.progress} / {furthestIncomplete.total} {season.unit || 'Chapters'} ({pct}%)
                                                </span>
                                            </div>
                                        </>);
                                    })() : (
                                        <p className="text-xs text-gray-500 italic mt-0.5">Not started</p>
                                    )}
                                </div>
                            </div>
                            {isOwned && (
                                <div className="p-1 hover:bg-stone-700 rounded transition-colors shrink-0 ml-2">
                                    {expanded ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                                </div>
                            )}
                        </div>
                    </div>

                    {isOwned && expanded && (
                        <div className="p-3 sm:p-4 border-t border-stone-800 space-y-2">
                             {sortedChars.length > 0 ? (
                                <div className="space-y-2">
                                    {sortedChars.map(char => (
                                        <CharacterRow 
                                            key={char.name}
                                            charName={char.name}
                                            progress={char.progress}
                                            total={char.total}
                                            unit={season.unit}
                                            charInfo={charInfo}
                                            onNavigate={onNavigate}
                                            pips={season.pips}
                                            groupBoundaries={season.groupBoundaries}
                                            showPips={showPips}
                                        />
                                    ))}
                                </div>
                             ) : (
                                 <div className="text-center text-gray-500 py-2">No characters found.</div>
                             )}
                        </div>
                    )}
                </div>
            );
        };

        const STORY_SHORT_NAMES = {
            'My Story': 'My Story',
            'Living World Season 1': 'LWS1',
            'Living World Season 2': 'LWS2',
            'Heart of Thorns': 'HoT',
            'Living World Season 3': 'LWS3',
            'Path of Fire': 'PoF',
            'Living World Season 4': 'LWS4',
            'The Icebrood Saga': 'IBS',
            'End of Dragons': 'EoD',
            'Secrets of the Obscure': 'SotO',
            'Janthir Wilds': 'JW',
            'Visions of Eternity': 'VoE',
        };

        const AccountSummary = ({ data, onNavigate, ownedStories, onToggleOwnership }) => {
            const [collapsed, setCollapsed] = useState(() => {
                const stored = localStorage.getItem('gw2_overview_collapsed');
                return stored !== null ? stored === 'true' : true;
            });
            const [showSettings, setShowSettings] = useState(false);
            const settingsRef = useRef(null);
            const toggle = () => {
                setCollapsed(prev => {
                    localStorage.setItem('gw2_overview_collapsed', String(!prev));
                    return !prev;
                });
            };

            useEffect(() => {
                if (!showSettings) return;
                const handler = (e) => {
                    if (settingsRef.current && !settingsRef.current.contains(e.target)) setShowSettings(false);
                };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [showSettings]);

            return (
                <div className="card-bg rounded-lg border border-stone-800 p-4 sm:p-6 mb-6">
                    <div className="flex items-center">
                        <button onClick={toggle} className="flex-1 flex items-center gap-2 cursor-pointer group">
                            <CheckCircle2 className="text-gw2-gold" size={18} />
                            <span className="text-xs text-gw2-gold uppercase tracking-wider font-bold">Story Completion Overview</span>
                            {collapsed ? <ChevronDown size={14} className="text-gray-500 group-hover:text-gw2-gold transition-colors" /> : <ChevronUp size={14} className="text-gray-500 group-hover:text-gw2-gold transition-colors" />}
                        </button>
                        <div className="relative" ref={settingsRef}>
                            <button
                                onClick={() => setShowSettings(p => !p)}
                                className={`p-1 rounded transition-colors ${showSettings ? 'text-gw2-gold' : 'text-gray-500 hover:text-gw2-gold-light'}`}
                                title="Story ownership settings"
                            >
                                <Settings size={14} />
                            </button>
                            {showSettings && (
                                <div className="absolute right-0 top-full mt-2 z-30 w-64 card-bg border border-stone-700 rounded-lg shadow-xl p-3">
                                    <p className="text-xs text-gray-400 mb-2">The GW2 API can't detect ownership of these stories. Toggle on any you own.</p>
                                    <div className="space-y-1.5">
                                        {MANUAL_OWNERSHIP_STORIES.map(name => {
                                            const color = STORY_COLORS[name];
                                            const shortName = STORY_SHORT_NAMES[name] || name;
                                            const isOn = ownedStories[name] || false;
                                            return (
                                                <button
                                                    key={name}
                                                    onClick={() => onToggleOwnership(name)}
                                                    className="w-full flex items-center justify-between gap-2 px-2 py-1.5 rounded hover:bg-white/5 transition-colors"
                                                >
                                                    <div className="flex items-center gap-2">
                                                        <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: color }}></span>
                                                        <span className={`text-sm ${isOn ? 'text-gray-200' : 'text-gray-500'}`}>{name}</span>
                                                    </div>
                                                    <div className={`w-8 h-5 rounded-full relative transition-colors ${isOn ? 'bg-gw2-gold' : 'bg-stone-700'}`}>
                                                        <div className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition-all ${isOn ? 'left-[calc(100%-1.125rem)]' : 'left-0.5'}`}></div>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {!collapsed && (
                        <div className="flex flex-wrap gap-1.5 sm:gap-2 justify-center mt-2.5">
                            {data.map(season => {
                                const isOwned = season.owned !== false;
                                const chars = Object.values(season.charData);
                                const completed = isOwned && chars.some(c => c.progress >= c.total);
                                const inProgress = isOwned && !completed && chars.some(c => c.progress > 0);
                                const maxPct = inProgress ? Math.max(...chars.map(c => c.total > 0 ? c.progress / c.total : 0)) : 0;
                                const color = STORY_COLORS[season.name];
                                const label = STORY_SHORT_NAMES[season.name] || season.name;
                                const pillClass = !isOwned
                                    ? 'border-stone-800 text-gray-600 opacity-40'
                                    : completed
                                        ? 'border-stone-700 text-gray-200'
                                        : inProgress
                                            ? 'border-stone-700 text-gray-200 opacity-85'
                                            : 'border-stone-800 text-gray-400 opacity-70';
                                const borderColor = !isOwned ? (color ? color + '30' : undefined) : completed ? color : inProgress ? color : color + '60';
                                return (
                                    <button
                                        key={season.id}
                                        title={isOwned ? season.name : `${season.name} (not owned)`}
                                        onClick={() => isOwned && onNavigate && onNavigate('season', season.id)}
                                        className={`inline-flex items-center gap-1.5 text-sm font-medium px-2.5 py-1 rounded border transition-all ${isOwned ? 'cursor-pointer hover:border-gw2-gold-dark hover:opacity-100' : 'cursor-default'} ${pillClass}`}
                                        style={color ? { borderLeft: `3px solid ${borderColor}` } : undefined}
                                    >
                                        {!isOwned && <Lock size={12} className="text-gray-600 shrink-0" />}
                                        {completed && <CheckCircle2 size={14} className="text-green-500 shrink-0" />}
                                        {inProgress && <ProgressCircle size={14} progress={maxPct} className="text-gw2-gold" />}
                                        {label}
                                    </button>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const HeroRecommendation = ({ data, charInfo, showPips = true }) => {
            const [collapsed, setCollapsed] = useState(() => {
                const stored = localStorage.getItem('gw2_hero_collapsed');
                return stored !== null ? stored === 'true' : false;
            });
            const toggle = () => {
                setCollapsed(prev => {
                    localStorage.setItem('gw2_hero_collapsed', String(!prev));
                    return !prev;
                });
            };

            const best = useMemo(() => {
                let top = null;
                let topPct = -1;

                data.filter(s => s.owned !== false).forEach(season => {
                    Object.entries(season.charData).forEach(([name, d]) => {
                        if (d.progress > 0 && d.total > 0 && d.progress < d.total) {
                            const pct = d.progress / d.total;
                            if (pct > topPct || (pct === topPct && d.progress > (top?.progress || 0))) {
                                topPct = pct;
                                top = {
                                    charName: name,
                                    seasonName: season.name,
                                    progress: d.progress,
                                    total: d.total,
                                    unit: season.unit,
                                    pct: Math.round(pct * 100),
                                    pips: season.pips,
                                    groupBoundaries: season.groupBoundaries
                                };
                            }
                        }
                    });
                });

                return top;
            }, [data]);

            if (!best) return null;
            const info = charInfo?.[best.charName];
            const heroGroupLabel = getCurrentGroupLabel(best.groupBoundaries, best.progress, best.total);

            return (
                <div className="card-bg rounded-lg border border-gw2-gold-dark/40 p-4 sm:p-6 mb-6 bg-gradient-to-r from-gw2-gold-dark/10 to-transparent">
                    <button onClick={toggle} className="w-full flex items-center gap-2 cursor-pointer group">
                        <PlayCircle className="text-gw2-gold" size={18} />
                        <span className="text-xs text-gw2-gold uppercase tracking-wider font-bold">Continue Your Journey</span>
                        {collapsed ? <ChevronDown size={14} className="text-gray-500 group-hover:text-gw2-gold transition-colors" /> : <ChevronUp size={14} className="text-gray-500 group-hover:text-gw2-gold transition-colors" />}
                    </button>
                    {!collapsed && (
                        <>
                            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between mt-3">
                                <div>
                                    <h3 className="text-lg sm:text-xl font-bold text-gray-100 font-display">{best.seasonName}</h3>
                                    <p className="text-sm text-gray-400 mt-1">
                                        {best.charName}
                                        {info && <span className="text-gray-500"> · Lv.{info.level} <span className="hidden sm:inline">{info.race} </span>{info.profession}</span>}
                                        <span className="text-gray-600"> — {best.progress} / {best.total} {best.unit}{heroGroupLabel && <> · {heroGroupLabel}</>}</span>
                                    </p>
                                </div>
                                <p className="text-3xl font-bold text-gw2-gold-light font-display mt-3 sm:mt-0">{best.pct}%</p>
                            </div>
                            <div className="mt-4">
                                <ProgressBar current={best.progress} total={best.total} colorClass="bg-gw2-gold" pips={showPips ? best.pips : []} />
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const CharacterCard = ({ charName, charInfo, seasons, isHidden, onToggleVisibility, onNavigate, focusId, onNavigated, defaultExpanded, showPips = true, expandAllSignal }) => {
            const [expanded, setExpanded] = useState(defaultExpanded || false);
            const [highlight, setHighlight] = useState(false);
            const cardRef = useRef(null);
            const info = charInfo?.[charName];

            useEffect(() => {
                if (expandAllSignal) setExpanded(expandAllSignal.expanded);
            }, [expandAllSignal]);

            useEffect(() => {
                if (defaultExpanded) setExpanded(true);
            }, [defaultExpanded]);

            useEffect(() => {
                if (focusId === charName) {
                    setExpanded(true);
                    setHighlight(true);
                    setTimeout(() => {
                        cardRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                    setTimeout(() => setHighlight(false), 1500);
                    onNavigated?.();
                }
            }, [focusId, charName, onNavigated]);

            const seasonProgress = useMemo(() => {
                return seasons
                    .filter(s => s.owned !== false)
                    .map(season => {
                        const cd = season.charData[charName];
                        return {
                            name: season.name,
                            id: season.id,
                            progress: cd?.progress || 0,
                            total: cd?.total || 0,
                            unit: season.unit || 'Chapters',
                            pips: season.pips,
                            groupBoundaries: season.groupBoundaries
                        };
                    })
                    .filter(s => s.total > 0);
            }, [seasons, charName]);

            const completedSeasons = seasonProgress.filter(s => s.progress >= s.total).length;
            const totalSeasons = seasonProgress.length;
            const totalQuestsCompleted = seasonProgress.reduce((s, sp) => s + sp.progress, 0);
            const totalQuestsTotal = seasonProgress.reduce((s, sp) => s + sp.total, 0);

            return (
                <div ref={cardRef} className={`card-bg rounded-lg border overflow-hidden mb-4 shadow-lg transition-all duration-700 scroll-mt-20 ${highlight ? 'border-gw2-gold ring-2 ring-gw2-gold/50' : 'border-stone-800'} ${isHidden ? 'opacity-50' : ''}`}>
                    <div className="p-3 sm:p-4 flex items-center justify-between bg-gradient-to-r from-stone-800 to-transparent">
                        <div className="flex items-center gap-2 sm:gap-3 min-w-0">
                            {info?.profession && PROFESSION_ICONS[info.profession]
                                ? <img src={PROFESSION_ICONS[info.profession]} alt={info.profession} className={`w-10 h-10 sm:w-12 sm:h-12 shrink-0 ${isHidden ? 'grayscale' : ''}`} />
                                : <User className="text-gw2-gold" size={24} />
                            }
                            <div className="min-w-0">
                                <h3 className="text-base sm:text-lg font-bold text-gray-100 font-display truncate">
                                    {charName}
                                    {info && <span className="hidden sm:inline ml-2 text-sm text-gray-400 font-normal font-sans">Lv.{info.level} {info.race} {info.profession}</span>}
                                    {isHidden && <span className="ml-2 text-xs text-gray-500 font-normal font-sans italic hidden sm:inline">Hidden from Story view</span>}
                                </h3>
                                {info && <p className="text-xs text-gray-400 sm:hidden">Lv.{info.level} {info.race} {info.profession}</p>}
                                {!isHidden && (<>
                                <p className="text-xs text-gray-400">
                                    <span className="text-green-400">{completedSeasons}</span> / {totalSeasons} Stories Completed
                                </p>
                                <div className="flex items-center gap-2 mt-1">
                                    <div className="w-24 sm:w-32">
                                        <ProgressBar current={totalQuestsCompleted} total={totalQuestsTotal}
                                            colorClass={totalQuestsCompleted >= totalQuestsTotal ? "bg-green-500" : "bg-gw2-gold"} />
                                    </div>
                                    <span className="text-xs text-gray-500">
                                        {totalQuestsCompleted} / {totalQuestsTotal} Quests ({Math.round((totalQuestsCompleted / totalQuestsTotal) * 100 || 0)}%)
                                    </span>
                                </div>
                                </>)}
                            </div>
                        </div>
                        <div className="flex items-center gap-1">
                            {onToggleVisibility && (
                            <button
                                onClick={() => onToggleVisibility(charName)}
                                className={`p-1 rounded transition-colors ${isHidden ? 'text-gray-600 hover:text-gray-300' : 'text-gray-400 hover:text-white'}`}
                                title={isHidden ? 'Show in Story view' : 'Hide from Story view'}
                            >
                                {isHidden ? <EyeOff size={18} /> : <Eye size={18} />}
                            </button>
                            )}
                            <button
                                onClick={() => setExpanded(!expanded)}
                                className="p-1 hover:bg-stone-700 rounded transition-colors"
                            >
                                {expanded ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                            </button>
                        </div>
                    </div>
                    {expanded && (
                        <div className="p-3 sm:p-4 border-t border-stone-800 space-y-2">
                            {seasonProgress.map(sp => {
                                const pct = Math.round((sp.progress / sp.total) * 100);
                                const isComplete = sp.progress >= sp.total;
                                const hasProgress = sp.progress > 0;
                                const spGroupLabel = getCurrentGroupLabel(sp.groupBoundaries, sp.progress, sp.total);
                                return (
                                    <div
                                        key={sp.id}
                                        className="flex items-center justify-between p-2 rounded hover:bg-white/5"
                                        style={STORY_COLORS[sp.name] ? { borderLeft: `3px solid ${STORY_COLORS[sp.name]}` } : undefined}
                                    >
                                        <div className="flex items-center gap-3 flex-1">
                                            <BookOpen size={16} className={isComplete ? "text-green-500" : hasProgress ? "text-gw2-gold-light" : "text-gray-600"} />
                                            <div className="flex flex-col">
                                                {onNavigate ? (
                                    <button onClick={() => onNavigate('season', sp.id)} className={`text-sm font-medium text-left hover:underline hover:text-gw2-gold-light transition-colors ${isComplete ? 'text-green-400' : 'text-gray-300'}`}>{sp.name}</button>
                                ) : (
                                    <span className={`text-sm font-medium ${isComplete ? 'text-green-400' : 'text-gray-300'}`}>{sp.name}</span>
                                )}
                                                <span className="text-xs text-gray-500">
                                                    {sp.progress} / {sp.total} {sp.unit} ({pct}%)
                                                    {spGroupLabel && <span className="text-gray-600"> · {spGroupLabel}</span>}
                                                </span>
                                            </div>
                                        </div>
                                        <div className="w-16 sm:w-24 ml-2 sm:ml-4">
                                            <ProgressBar current={sp.progress} total={sp.total} colorClass={isComplete ? "bg-green-500" : hasProgress ? "bg-gw2-gold" : "bg-gray-600"} pips={showPips ? sp.pips : []} />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const storedApiKey = localStorage.getItem('gw2_api_key') || '';
            const storedGw2meToken = localStorage.getItem('gw2me_access_token') || '';
            const storedGw2meAccountId = localStorage.getItem('gw2me_account_id') || '';
            const hasOAuthCallback = !!new URLSearchParams(window.location.search).get('code');

            const [apiKey, setApiKey] = useState(storedApiKey);
            const [authMethod, setAuthMethod] = useState(storedGw2meToken ? 'gw2me' : storedApiKey ? 'api_key' : null);
            const [gw2meToken, setGw2meToken] = useState(storedGw2meToken);
            const [gw2meAccountId, setGw2meAccountId] = useState(storedGw2meAccountId);
            const [hasAccess, setHasAccess] = useState(!!storedApiKey || !!storedGw2meToken);
            const [oauthPending, setOauthPending] = useState(hasOAuthCallback);
            const [gw2meAccounts, setGw2meAccounts] = useState(null);
            const [loading, setLoading] = useState(hasOAuthCallback);
            const [error, setError] = useState(null);
            const [status, setStatus] = useState(hasOAuthCallback ? 'Completing authorization...' : '');
            const [subtokenSlow, setSubtokenSlow] = useState(false);
            const subtokenAbortRef = useRef(null);
            const [loadProgress, setLoadProgress] = useState({ current: 0, total: 1 });
            const [data, setData] = useState(null);
            const [charInfo, setCharInfo] = useState({});
            const [cachedAt, setCachedAt] = useState(null);
            const [staleText, setStaleText] = useState('');
            const [showStaleBanner, setShowStaleBanner] = useState(false);
            const [viewMode, setViewMode] = useState('season');
            const [charSort, setCharSort] = useState('progress');
            const [navigateTarget, setNavigateTarget] = useState(null);
            const [showGw2meInfo, setShowGw2meInfo] = useState(false);
            const [showAccessInfo, setShowAccessInfo] = useState(false);
            const [showAppSettings, setShowAppSettings] = useState(false);
            const [expandAllSignal, setExpandAllSignal] = useState(null);
            const appSettingsRef = useRef(null);
            useEffect(() => {
                if (!showAppSettings) return;
                const handler = (e) => {
                    if (appSettingsRef.current && !appSettingsRef.current.contains(e.target)) setShowAppSettings(false);
                };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [showAppSettings]);
            const [showPips, setShowPips] = useState(() => {
                const stored = localStorage.getItem('gw2_show_pips');
                return stored !== null ? stored === 'true' : false;
            });
            const toggleShowPips = useCallback(() => {
                setShowPips(prev => {
                    localStorage.setItem('gw2_show_pips', String(!prev));
                    return !prev;
                });
            }, []);
            const [hideUnowned, setHideUnowned] = useState(() => {
                const stored = localStorage.getItem('gw2_hide_unowned');
                return stored !== null ? stored === 'true' : false;
            });
            const toggleHideUnowned = useCallback(() => {
                setHideUnowned(prev => {
                    localStorage.setItem('gw2_hide_unowned', String(!prev));
                    return !prev;
                });
            }, []);
            const [accountName, setAccountName] = useState('');
            const [hiddenChars, setHiddenChars] = useState(() => {
                const stored = localStorage.getItem('gw2_hidden_chars');
                return stored ? new Set(JSON.parse(stored)) : new Set();
            });
            const toggleCharVisibility = useCallback((name) => {
                setHiddenChars(prev => {
                    const next = new Set(prev);
                    next.has(name) ? next.delete(name) : next.add(name);
                    localStorage.setItem('gw2_hidden_chars', JSON.stringify([...next]));
                    return next;
                });
            }, []);
            const [ownedStories, setOwnedStories] = useState(() => {
                try {
                    const stored = localStorage.getItem('gw2_owned_stories');
                    if (stored) return JSON.parse(stored);
                } catch (e) {}
                return Object.fromEntries(MANUAL_OWNERSHIP_STORIES.map(s => [s, false]));
            });
            const toggleStoryOwnership = useCallback((name) => {
                setOwnedStories(prev => {
                    const next = { ...prev, [name]: !prev[name] };
                    localStorage.setItem('gw2_owned_stories', JSON.stringify(next));
                    return next;
                });
            }, []);

            const navigateTo = useCallback((type, id) => {
                setViewMode(type === 'character' ? 'character' : 'season');
                setNavigateTarget({ type, id });
            }, []);

            const fetchData = useCallback(async (key) => {
                setLoading(true);
                setError(null);
                try {
                    setLoadProgress({ current: 0, total: 1 });
                    setStatus('Loading game data and quest database...');
                    const [seasonsData, storiesData, questToStoryMap] = await Promise.all([
                        fetch(`${API_BASE}/stories/seasons?ids=all`).then(r => r.json()),
                        fetch(`${API_BASE}/stories?ids=all`).then(r => r.json()),
                        fetch('quest-data.json').then(r => r.json())
                    ]);

                    const seasonMap = {};
                    seasonsData.sort((a, b) => a.order - b.order).forEach(s => {
                        seasonMap[s.id] = { ...s, stories: [] };
                    });

                    const storyToSeasonMap = {};
                    storiesData.sort((a, b) => a.order - b.order).forEach(story => {
                        if (seasonMap[story.season]) {
                            seasonMap[story.season].stories.push(story);
                            storyToSeasonMap[story.id] = story.season;
                        }
                    });

                    setLoadProgress({ current: 1, total: 3 });
                    setStatus('Fetching account data...');
                    const [chars, accountData] = await Promise.all([
                        fetch(`${API_BASE}/characters?access_token=${key}`).then(r => r.json()),
                        fetch(`${API_BASE}/account?access_token=${key}`)
                            .then(r => r.ok ? r.json() : null)
                            .catch(() => null)
                    ]);
                    const accountAccess = accountData?.access || [];
                    const rawName = accountData?.name || '';
                    const displayName = rawName.replace(/\.\d+$/, '');

                    const totalUnits = 2 + chars.length + 1;
                    setLoadProgress({ current: 2, total: totalUnits });

                    const charQuests = {};
                    const charInfoMap = {};
                    const batchSize = 5;

                    for (let i = 0; i < chars.length; i += batchSize) {
                        const scannedSoFar = Math.min(i + batchSize, chars.length);
                        setLoadProgress({ current: 2 + scannedSoFar, total: totalUnits });
                        setStatus(`Scanning characters (${scannedSoFar} / ${chars.length})...`);

                        const batch = chars.slice(i, i + batchSize);
                        const promises = batch.map(async (name) => {
                            const safeName = encodeURIComponent(name);
                            const [questsRes, coreRes] = await Promise.all([
                                fetch(`${API_BASE}/characters/${safeName}/quests?access_token=${key}`),
                                fetch(`${API_BASE}/characters/${safeName}/core?access_token=${key}`)
                            ]);
                            if(questsRes.ok) {
                                charQuests[name] = await questsRes.json();
                            } else {
                                console.warn(`Could not fetch quests for ${name}`);
                                charQuests[name] = [];
                            }
                            if(coreRes.ok) {
                                const coreData = await coreRes.json();
                                charInfoMap[name] = { race: coreData.race, profession: coreData.profession, level: coreData.level };
                            }
                        });
                        await Promise.all(promises);
                        await new Promise(r => setTimeout(r, 100));
                    }

                    setLoadProgress({ current: totalUnits, total: totalUnits });
                    setStatus('Calculating recommendations...');

                    const storyQuestCounts = {};
                    Object.values(questToStoryMap).forEach(storyId => {
                        storyQuestCounts[storyId] = (storyQuestCounts[storyId] || 0) + 1;
                    });

                    const processedSeasons = Object.values(seasonMap).map(season => {
                        const charProgressMap = {};
                        const myStory = season.id === MY_STORY_SEASON_ID;
                        const seasonTotalQuests = season.stories.reduce((sum, s) =>
                            sum + (storyQuestCounts[s.id] || 0), 0);
                        const useQuestLevel = seasonTotalQuests > 0;

                        chars.forEach(charName => {
                            const race = charInfoMap[charName]?.race;
                            const applicableStories = season.stories.filter(s =>
                                !s.races || s.races.length === 0 || s.races.includes(race)
                            );
                            const applicableStoryIds = new Set(applicableStories.map(s => s.id));
                            const completedQuests = charQuests[charName] || [];

                            const completedStoryIdsInSeason = new Set();
                            let completedQuestCount = 0;

                            completedQuests.forEach(qId => {
                                const storyId = questToStoryMap[qId];
                                if (storyId && applicableStoryIds.has(storyId)) {
                                    completedStoryIdsInSeason.add(storyId);
                                    completedQuestCount++;
                                }
                            });


                            if (useQuestLevel) {
                                const totalQuests = myStory
                                    ? MY_STORY_QUESTS_PER_PATH
                                    : applicableStories.reduce((sum, s) => sum + (storyQuestCounts[s.id] || 0), 0);
                                charProgressMap[charName] = {
                                    progress: completedQuestCount,
                                    total: totalQuests,
                                    completedIds: completedStoryIdsInSeason
                                };
                            } else {
                                charProgressMap[charName] = {
                                    progress: completedStoryIdsInSeason.size,
                                    total: applicableStories.length,
                                    completedIds: completedStoryIdsInSeason
                                };
                            }
                        });

                        let bestCandidate = null;
                        let maxProgress = -1;

                        Object.entries(charProgressMap).forEach(([name, data]) => {
                            const p = data.progress;
                            const total = data.total;

                            if (total === 0) return;

                            if (p > 0 && p < total) {
                                if (p > maxProgress) {
                                    maxProgress = p;
                                    bestCandidate = { name, progress: p, total };
                                }
                            }
                        });

                        const uniqueOrders = new Set(season.stories.map(s => s.order));
                        const displayTotal = useQuestLevel
                            ? (myStory ? MY_STORY_QUESTS_PER_PATH : seasonTotalQuests)
                            : uniqueOrders.size;

                        const requiredAccess = EXPANSION_MAP[season.name];
                        const owned = !requiredAccess || accountAccess.includes(requiredAccess);
                        const pips = computeSeasonPips(season.id, season.stories, storyQuestCounts, useQuestLevel);
                        const groupBoundaries = computeGroupBoundaries(season.id, season.stories, storyQuestCounts, useQuestLevel);

                        return {
                            ...season,
                            totalStories: displayTotal,
                            unit: useQuestLevel ? 'Quests' : 'Chapters',
                            charData: charProgressMap,
                            recommendation: owned ? bestCandidate : null,
                            owned,
                            requiredExpansion: requiredAccess && !owned ? season.name : null,
                            pips,
                            groupBoundaries
                        };
                    });

                    const validSeasons = processedSeasons.filter(s => s.totalStories > 0);

                    const cacheableSeasons = validSeasons.map(s => ({
                        ...s,
                        stories: undefined,
                        charData: Object.fromEntries(
                            Object.entries(s.charData).map(([n, d]) => [n, { progress: d.progress, total: d.total }])
                        )
                    }));

                    setData(cacheableSeasons);
                    setCharInfo(charInfoMap);
                    setAccountName(displayName);
                    const now = Date.now();
                    setCachedAt(now);
                    setLoading(false);

                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify({
                            data: cacheableSeasons,
                            charInfo: charInfoMap,
                            accountName: displayName,
                            cachedAt: now
                        }));
                    } catch (e) { console.warn('Cache save failed', e); }

                } catch (err) {
                    console.error(err);
                    setError("Failed to fetch or parse game data. " + err.message);
                    setLoading(false);
                }
            }, []);

            // Handle OAuth callback from gw2.me
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('code');
                if (!code) return;

                const state = params.get('state');
                const iss = params.get('iss');
                const storedState = sessionStorage.getItem('gw2me_state');

                history.replaceState(null, '', window.location.pathname);

                if (state !== storedState) {
                    setError('OAuth state mismatch — please try logging in again.');
                    setOauthPending(false);
                    setLoading(false);
                    return;
                }
                if (iss !== 'https://gw2.me') {
                    setError('Invalid OAuth issuer.');
                    setOauthPending(false);
                    setLoading(false);
                    return;
                }

                const codeVerifier = sessionStorage.getItem('gw2me_code_verifier');
                sessionStorage.removeItem('gw2me_state');
                sessionStorage.removeItem('gw2me_code_verifier');

                (async () => {
                    try {
                        setStatus('Exchanging authorization code...');
                        const tokenRes = await fetch(GW2ME_TOKEN_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: new URLSearchParams({
                                grant_type: 'authorization_code',
                                code,
                                client_id: GW2ME_CLIENT_ID,
                                redirect_uri: GW2ME_REDIRECT_URI,
                                code_verifier: codeVerifier
                            })
                        });
                        if (!tokenRes.ok) throw new Error('Failed to exchange authorization code');
                        const tokenData = await tokenRes.json();
                        const accessToken = tokenData.access_token;

                        setStatus('Fetching account info from gw2.me...');
                        const accounts = await getGw2meAccounts(accessToken);
                        if (!accounts || accounts.length === 0) throw new Error('No GW2 accounts found on gw2.me');

                        localStorage.setItem('gw2me_access_token', accessToken);
                        setGw2meToken(accessToken);

                        if (accounts.length > 1) {
                            setGw2meAccounts(accounts);
                            setOauthPending(false);
                            setLoading(false);
                            setStatus('');
                            return;
                        }

                        const account = accounts[0];
                        localStorage.setItem('gw2me_account_id', account.id);
                        setGw2meAccountId(account.id);
                        setAuthMethod('gw2me');
                        setHasAccess(true);
                        setOauthPending(false);

                        setStatus('Generating API subtoken...');
                        const subtoken = await fetchSubtokenWithSlowDetect(accessToken, account.id);
                        await fetchData(subtoken);
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                        setError(err.message);
                        setOauthPending(false);
                        setLoading(false);
                    }
                })();
            }, []);

            // Initial data load — prefer cached data, only fetch if no cache exists
            useEffect(() => {
                if (hasOAuthCallback) return;
                if (!hasAccess || data) return;

                try {
                    const raw = localStorage.getItem(CACHE_KEY);
                    if (raw) {
                        const cached = JSON.parse(raw);
                        setData(cached.data);
                        setCharInfo(cached.charInfo);
                        setAccountName(cached.accountName || '');
                        setCachedAt(cached.cachedAt);
                        return;
                    }
                } catch (e) { console.warn('Cache load failed', e); }

                if (authMethod === 'gw2me') {
                    (async () => {
                        try {
                            setLoading(true);
                            setStatus('Generating API subtoken...');
                            const subtoken = await fetchSubtokenWithSlowDetect(gw2meToken, gw2meAccountId);
                            await fetchData(subtoken);
                        } catch (err) {
                            if (err.name === 'AbortError') return;
                            setError('gw2.me session expired. Please log in again.');
                            logout();
                        }
                    })();
                } else if (apiKey) {
                    fetchData(apiKey);
                }
            }, []);

            useEffect(() => {
                if (!cachedAt) return;
                const update = () => {
                    setStaleText(formatRelativeTime(cachedAt));
                    setShowStaleBanner(Date.now() - cachedAt > STALE_THRESHOLD_MS);
                };
                update();
                const id = setInterval(update, 30000);
                return () => clearInterval(id);
            }, [cachedAt]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                setStatus('Validating key...');

                try {
                    const tokenRes = await fetch(`${API_BASE}/tokeninfo?access_token=${apiKey}`);
                    if (!tokenRes.ok) throw new Error("Invalid API Key");
                    const tokenInfo = await tokenRes.json();
                    
                    const permissions = tokenInfo.permissions;
                    const required = ['account', 'characters', 'progression'];
                    const missing = required.filter(p => !permissions.includes(p));
                    if (missing.length > 0) {
                        throw new Error(`API Key needs '${missing.join("', '")}' scopes.`);
                    }

                    localStorage.setItem('gw2_api_key', apiKey);
                    setAuthMethod('api_key');
                    setHasAccess(true);
                    await fetchData(apiKey);
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };

            const handleGw2meLogin = async () => {
                setError(null);
                const verifier = generateCodeVerifier();
                const challenge = await deriveCodeChallenge(verifier);
                const state = generateState();

                sessionStorage.setItem('gw2me_code_verifier', verifier);
                sessionStorage.setItem('gw2me_state', state);

                const params = new URLSearchParams({
                    client_id: GW2ME_CLIENT_ID,
                    response_type: 'code',
                    redirect_uri: GW2ME_REDIRECT_URI,
                    scope: GW2ME_SCOPES,
                    state,
                    code_challenge: challenge,
                    code_challenge_method: 'S256'
                });

                window.location.href = `${GW2ME_AUTH_URL}?${params.toString()}`;
            };

            const handleRefresh = useCallback(async () => {
                if (authMethod === 'gw2me') {
                    try {
                        setLoading(true);
                        setError(null);
                        setStatus('Generating fresh API subtoken...');
                        const subtoken = await fetchSubtokenWithSlowDetect(gw2meToken, gw2meAccountId);
                        await fetchData(subtoken);
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                        setError('gw2.me session expired. Please log in again.');
                        logout();
                    }
                } else {
                    await fetchData(apiKey);
                }
            }, [authMethod, gw2meToken, gw2meAccountId, apiKey, fetchData]);

            const logout = () => {
                if (subtokenAbortRef.current) { subtokenAbortRef.current.abort(); subtokenAbortRef.current = null; }
                localStorage.removeItem('gw2_api_key');
                localStorage.removeItem('gw2me_access_token');
                localStorage.removeItem('gw2me_account_id');
                localStorage.removeItem(CACHE_KEY);
                setApiKey('');
                setGw2meToken('');
                setGw2meAccountId('');
                setAuthMethod(null);
                setHasAccess(false);
                setData(null);
                setCharInfo({});
                setAccountName('');
                setCachedAt(null);
                setLoading(false);
                setStatus('');
                setSubtokenSlow(false);
            };

            const fetchSubtokenWithSlowDetect = async (token, accountId) => {
                const controller = new AbortController();
                subtokenAbortRef.current = controller;
                setSubtokenSlow(false);
                const timer = setTimeout(() => setSubtokenSlow(true), 15000);
                try {
                    const subtoken = await getGw2meSubtoken(token, accountId, { signal: controller.signal });
                    return subtoken;
                } finally {
                    clearTimeout(timer);
                    subtokenAbortRef.current = null;
                    setSubtokenSlow(false);
                }
            };

            const selectGw2meAccount = useCallback(async (account) => {
                try {
                    setLoading(true);
                    setStatus('Generating API subtoken...');
                    setError(null);
                    localStorage.setItem('gw2me_account_id', account.id);
                    setGw2meAccountId(account.id);
                    setAuthMethod('gw2me');
                    setHasAccess(true);
                    setGw2meAccounts(null);
                    const subtoken = await fetchSubtokenWithSlowDetect(gw2meToken, account.id);
                    await fetchData(subtoken);
                } catch (err) {
                    if (err.name === 'AbortError') return;
                    setError(err.message);
                    setLoading(false);
                }
            }, [gw2meToken, fetchData]);

            const visibleData = useMemo(() => {
                if (!data) return data;
                return data.map(season => {
                    const isManual = MANUAL_OWNERSHIP_STORIES.includes(season.name);
                    const owned = isManual ? (ownedStories[season.name] || false) : season.owned;

                    const filteredCharData = {};
                    Object.entries(season.charData).forEach(([name, d]) => {
                        if (!hiddenChars.has(name)) filteredCharData[name] = d;
                    });
                    let recommendation = null;
                    if (owned !== false) {
                        let topPct = -1;
                        Object.entries(filteredCharData).forEach(([name, d]) => {
                            if (d.progress > 0 && d.total > 0 && d.progress < d.total) {
                                const pct = d.progress / d.total;
                                if (pct > topPct || (pct === topPct && d.progress > (recommendation?.progress || 0))) {
                                    topPct = pct;
                                    recommendation = { name, ...d };
                                }
                            }
                        });
                    }
                    return { ...season, owned, charData: filteredCharData, recommendation, requiredExpansion: !owned ? season.name : null };
                }).filter(s => !hideUnowned || s.owned !== false);
            }, [data, hiddenChars, ownedStories, hideUnowned]);

            if (oauthPending) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <Loader2 className="animate-spin text-gw2-gold w-12 h-12 mb-6" />
                        <p className="text-gray-300 text-sm font-medium">{status || 'Completing authorization...'}</p>
                        {subtokenSlow && (
                            <div className="mt-4 text-center">
                                <p className="text-yellow-400 text-sm mb-3">gw2.me is taking longer than expected to respond...</p>
                                <button onClick={logout} className="text-sm text-gray-400 hover:text-white border border-stone-700 hover:border-stone-600 px-4 py-2 rounded-lg transition-colors">
                                    Return to login &amp; use API key instead
                                </button>
                            </div>
                        )}
                        {error && (
                            <div className="bg-red-900/20 border border-red-900/50 p-3 rounded flex items-start gap-2 text-red-200 text-sm mt-6 max-w-md">
                                <AlertCircle size={16} className="mt-0.5 shrink-0" />
                                <span>{error}</span>
                            </div>
                        )}
                    </div>
                );
            }

            if (gw2meAccounts) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <img src="logo.svg" alt="GW2 Story Tracker" className="w-24 h-24 sm:w-[150px] sm:h-[150px] mb-6" />
                        <h1 className="text-2xl sm:text-3xl font-bold font-display text-gw2-gold mb-2">Select Account</h1>
                        <p className="text-gray-400 text-sm mb-6 text-center max-w-sm">Multiple Guild Wars 2 accounts are linked to your gw2.me profile. Choose which one to load.</p>
                        <div className="w-full max-w-sm space-y-2">
                            {gw2meAccounts.map(acct => (
                                <button key={acct.id} onClick={() => selectGw2meAccount(acct)}
                                    className="w-full p-4 rounded-lg border border-stone-700 card-bg hover:border-gw2-gold-dark transition-colors text-left flex items-center justify-between group">
                                    <div>
                                        <span className="text-gray-100 font-medium font-display group-hover:text-gw2-gold-light transition-colors">{acct.name || 'Unknown Account'}</span>
                                    </div>
                                    <ChevronDown size={16} className="text-gray-500 -rotate-90 group-hover:text-gw2-gold transition-colors" />
                                </button>
                            ))}
                        </div>
                        <button onClick={() => { setGw2meAccounts(null); setGw2meToken(''); localStorage.removeItem('gw2me_access_token'); }}
                            className="mt-6 text-sm text-gray-500 hover:text-gray-300 transition-colors">
                            Cancel
                        </button>
                        {error && (
                            <div className="bg-red-900/20 border border-red-900/50 p-3 rounded flex items-start gap-2 text-red-200 text-sm mt-4 max-w-sm">
                                <AlertCircle size={16} className="mt-0.5 shrink-0" />
                                <span>{error}</span>
                            </div>
                        )}
                    </div>
                );
            }

            if (!hasAccess) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="card-bg w-full max-w-md p-6 sm:p-8 rounded-xl shadow-2xl border border-stone-800">
                            <div className="flex justify-center mb-6">
                                <img src="logo.svg" alt="GW2 Story Tracker" className="w-24 h-24 sm:w-[150px] sm:h-[150px] rounded-lg" />
                            </div>
                            <h1 className="text-2xl sm:text-3xl font-bold text-center mb-2 font-display">Guild Wars 2 Story Tracker</h1>
                            <p className="text-gray-400 text-center mb-8">
                                Analyze your story progress across all characters.
                            </p>

                            {error && (
                                <div className="bg-red-900/20 border border-red-900/50 p-3 rounded flex items-start gap-2 text-red-200 text-sm mb-4">
                                    <AlertCircle size={16} className="mt-0.5 shrink-0" />
                                    <span>{error}</span>
                                </div>
                            )}

                            <button
                                type="button"
                                onClick={handleGw2meLogin}
                                disabled={loading}
                                className="w-full text-white font-bold py-3 rounded transition-colors flex justify-center items-center gap-2.5 hover:opacity-90"
                                style={{ background: '#303339' }}
                            >
                                {loading ? <Loader2 className="animate-spin" /> : (
                                    <>
                                        <svg width="20" height="20" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><g fill="#B7000D" fillRule="evenodd" clipPath="url(#gw2me)" clipRule="evenodd"><path d="M8 1a3 3 0 0 0-3 3v2.5a.5.5 0 0 1-1 0V4a4 4 0 0 1 7.615-1.715.5.5 0 1 1-.903.43A3 3 0 0 0 8 1Z"/><path d="M11.916 6.223A.5.5 0 0 0 11.5 6H5V4a3 3 0 0 1 5.712-1.285.5.5 0 1 0 .903-.43A4 4 0 0 0 4 4v2.349L2.084 9.223a.5.5 0 0 0 .062.63l5.5 5.5a.5.5 0 0 0 .708 0l5.5-5.5a.5.5 0 0 0 .062-.63l-2-3ZM8 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></g><defs><clipPath id="gw2me"><path fill="#fff" d="M0 0h16v16H0z"/></clipPath></defs></svg>
                                        Login with gw2.me
                                    </>
                                )}
                            </button>
                            <p className="text-xs text-gray-500 mt-2 text-center">
                                No API key needed — authorize securely through <a href="https://gw2.me" target="_blank" rel="noopener noreferrer" className="text-gray-400 hover:text-gray-300 transition-colors">gw2.me</a>
                            </p>

                            <div className="flex items-center gap-4 my-6">
                                <div className="flex-1 border-t border-stone-700"></div>
                                <span className="text-gray-500 text-sm">or use an API key</span>
                                <div className="flex-1 border-t border-stone-700"></div>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-400 mb-1">API Key</label>
                                    <input 
                                        type="text" 
                                        value={apiKey}
                                        onChange={(e) => setApiKey(e.target.value)}
                                        className="w-full bg-black/30 border border-stone-700 rounded px-4 py-3 text-white focus:outline-none focus:border-gw2-gold transition-colors"
                                        placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXXXXXXXXXX"
                                    />
                                    <p className="text-xs text-gray-500 mt-1">
                                        Required permissions: <span className="text-gray-300">account, characters, progression</span>
                                    </p>
                                    <p className="text-xs text-gray-500 mt-2">
                                        <a href="https://account.arena.net/applications/create" target="_blank" rel="noopener noreferrer" className="text-gw2-gold hover:text-gw2-gold-light transition-colors">Create a new API key</a>
                                        <span className="mx-1.5 text-stone-700">·</span>
                                        <a href="https://account.arena.net/applications" target="_blank" rel="noopener noreferrer" className="text-gw2-gold hover:text-gw2-gold-light transition-colors">Manage existing keys</a>
                                    </p>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full gw2-gradient text-white font-bold py-3 rounded hover:opacity-90 transition-opacity flex justify-center items-center gap-2"
                                >
                                    {loading ? <Loader2 className="animate-spin" /> : "Load Account"}
                                </button>
                            </form>
                        </div>
                        <p className="text-center text-sm text-gray-500 mt-5">
