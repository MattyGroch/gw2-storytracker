                            Want to see it in action first? <a href="demo.html" className="text-gw2-gold hover:text-gw2-gold-light transition-colors font-medium">Try the demo →</a>
                        </p>
                        <footer className="text-center text-xs text-gray-600 mt-6">
                            <a href="privacy.html" className="hover:text-gray-400 transition-colors">Privacy Policy</a>
                            <span className="mx-1.5">·</span>
                            <a href="tos.html" className="hover:text-gray-400 transition-colors">Terms of Service</a>
                            <span className="mx-1.5">·</span>
                            <a href="https://github.com/MattyGroch/gw2-storytracker" target="_blank" rel="noopener noreferrer" className="hover:text-gray-400 transition-colors">GitHub</a>
                            <span className="mx-1.5">·</span>
                            <a href="https://gw2pathfinder.com" target="_blank" rel="noopener noreferrer" className="hover:text-gray-400 transition-colors">GW2 Pathfinder</a>
                        </footer>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-12">
                    {/* Navbar */}
                    <nav className="card-bg border-b border-stone-800 sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src="logo.svg" alt="GW2 Story Tracker" className="w-8 h-8 rounded" />
                                <span className="font-bold text-xl hidden sm:inline font-display">Guild Wars 2 Story Tracker</span>
                            </div>
                            <div className="flex items-center gap-3 sm:gap-4">
                                {staleText && !loading && (
                                    <span className="text-xs text-gray-500 hidden sm:inline">Data from {staleText}</span>
                                )}
                                <button
                                    onClick={handleRefresh}
                                    disabled={loading}
                                    className="text-gray-400 hover:text-white flex items-center gap-2 text-sm disabled:opacity-50 transition-colors p-1"
                                >
                                    <RefreshCw size={20} className={`sm:w-4 sm:h-4 ${loading ? "animate-spin" : ""}`} /> <span className="hidden sm:inline">Refresh</span>
                                </button>
                                <button onClick={() => setShowAccessInfo(!showAccessInfo)}
                                    className="text-gray-500 hover:text-gw2-gold-light transition-colors p-1"
                                    title="About story access">
                                    <Info size={20} className="sm:w-4 sm:h-4" />
                                </button>
                                {authMethod === 'gw2me' && (
                                    <button onClick={() => setShowGw2meInfo(!showGw2meInfo)}
                                        className="text-gray-500 hover:text-gw2-gold-light transition-colors relative p-1"
                                        title="gw2.me account info">
                                        <svg className="w-5 h-5 sm:w-4 sm:h-4" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><g fill="currentColor" fillRule="evenodd" clipPath="url(#gw2me-nav)" clipRule="evenodd"><path d="M8 1a3 3 0 0 0-3 3v2.5a.5.5 0 0 1-1 0V4a4 4 0 0 1 7.615-1.715.5.5 0 1 1-.903.43A3 3 0 0 0 8 1Z"/><path d="M11.916 6.223A.5.5 0 0 0 11.5 6H5V4a3 3 0 0 1 5.712-1.285.5.5 0 1 0 .903-.43A4 4 0 0 0 4 4v2.349L2.084 9.223a.5.5 0 0 0 .062.63l5.5 5.5a.5.5 0 0 0 .708 0l5.5-5.5a.5.5 0 0 0 .062-.63l-2-3ZM8 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></g><defs><clipPath id="gw2me-nav"><path fill="#fff" d="M0 0h16v16H0z"/></clipPath></defs></svg>
                                    </button>
                                )}
                                <div className="relative" ref={appSettingsRef}>
                                    <button onClick={() => setShowAppSettings(p => !p)}
                                        className={`p-1 rounded transition-colors ${showAppSettings ? 'text-gw2-gold' : 'text-gray-500 hover:text-gw2-gold-light'}`}
                                        title="Settings">
                                        <Settings size={20} className="sm:w-4 sm:h-4" />
                                    </button>
                                    {showAppSettings && (
                                        <div className="absolute right-0 top-full mt-2 z-30 w-64 card-bg border border-stone-700 rounded-lg shadow-xl p-3">
                                            <p className="text-xs text-gray-400 mb-3 font-medium uppercase tracking-wider">Settings</p>
                                            <div className="flex items-center justify-between gap-3">
                                                <span className="text-sm text-gray-300">Show act/chapter dividers on progress bars</span>
                                                <button
                                                    onClick={toggleShowPips}
                                                    className={`relative inline-flex h-5 w-9 shrink-0 rounded-full border-2 border-transparent transition-colors duration-200 cursor-pointer ${showPips ? 'bg-gw2-gold-dark' : 'bg-stone-700'}`}
                                                    role="switch"
                                                    aria-checked={showPips}
                                                >
                                                    <span className={`pointer-events-none inline-block h-4 w-4 rounded-full bg-white shadow transform transition-transform duration-200 ${showPips ? 'translate-x-4' : 'translate-x-0'}`} />
                                                </button>
                                            </div>
                                            <div className="flex items-center justify-between gap-3 mt-2">
                                                <span className="text-sm text-gray-300">Hide unowned content</span>
                                                <button
                                                    onClick={toggleHideUnowned}
                                                    className={`relative inline-flex h-5 w-9 shrink-0 rounded-full border-2 border-transparent transition-colors duration-200 cursor-pointer ${hideUnowned ? 'bg-gw2-gold-dark' : 'bg-stone-700'}`}
                                                    role="switch"
                                                    aria-checked={hideUnowned}
                                                >
                                                    <span className={`pointer-events-none inline-block h-4 w-4 rounded-full bg-white shadow transform transition-transform duration-200 ${hideUnowned ? 'translate-x-4' : 'translate-x-0'}`} />
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <button 
                                    onClick={logout}
                                    className="text-gray-400 hover:text-white flex items-center gap-2 text-sm transition-colors p-1"
                                >
                                    <LogOut size={20} className="sm:w-4 sm:h-4" /> <span className="hidden sm:inline">Sign Out</span>
                                </button>
                            </div>
                        </div>
                        {loading && data && (
                            <div className="max-w-4xl mx-auto px-4 pb-1">
                                <ProgressBar current={loadProgress.current} total={loadProgress.total} colorClass="bg-gw2-gold" />
                            </div>
                        )}
                    </nav>
                    {showGw2meInfo && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setShowGw2meInfo(false)}>
                            <div className="absolute inset-0 bg-black/60"></div>
                            <div className="relative card-bg border border-stone-700 rounded-xl shadow-2xl max-w-sm w-full p-6" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold font-display text-gw2-gold mb-3">gw2.me Account Info</h3>
                                <p className="text-sm text-gray-300 mb-4">
                                    If you recently added a new API key or account to your gw2.me profile, you'll need to revoke access for this app and log back in to update your shared accounts.
                                </p>
                                <div className="flex flex-col gap-2">
                                    <button onClick={async () => {
                                        try {
                                            setShowGw2meInfo(false);
                                            setLoading(true);
                                            setStatus('Fetching account list from gw2.me...');
                                            const accounts = await getGw2meAccounts(gw2meToken);
                                            if (accounts && accounts.length > 1) {
                                                setGw2meAccounts(accounts);
                                                setData(null);
                                                setLoading(false);
                                                setStatus('');
                                            } else {
                                                setStatus('Only one account found.');
                                                setLoading(false);
                                            }
                                        } catch (err) {
                                            setError('Failed to fetch accounts. Try signing out and back in.');
                                            setLoading(false);
                                        }
                                    }}
                                        className="w-full text-center px-4 py-2 rounded-lg bg-gw2-gold-dark/30 border border-gw2-gold-dark text-gw2-gold-light text-sm font-medium hover:bg-gw2-gold-dark/50 transition-colors">
                                        Switch Account
                                    </button>
                                    <div className="flex items-center gap-3">
                                        <a href="https://gw2.me/applications" target="_blank" rel="noopener noreferrer"
                                            className="flex-1 text-center px-4 py-2 rounded-lg border border-stone-700 text-gray-400 text-sm hover:text-white hover:border-stone-600 transition-colors">
                                            Manage on gw2.me
                                        </a>
                                        <button onClick={() => setShowGw2meInfo(false)}
                                            className="px-4 py-2 rounded-lg border border-stone-700 text-gray-400 text-sm hover:text-white hover:border-stone-600 transition-colors">
                                            Close
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAccessInfo && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={() => setShowAccessInfo(false)}>
                            <div className="absolute inset-0 bg-black/60"></div>
                            <div className="relative card-bg border border-stone-700 rounded-xl shadow-2xl max-w-sm w-full p-6" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold font-display text-gw2-gold mb-3">Story Access</h3>
                                <p className="text-sm text-gray-300 mb-3">
                                    Stories are shown or hidden based on the expansions listed on your Guild Wars 2 account. Stories you don't own appear locked and are excluded from progress calculations.
                                </p>
                                <p className="text-sm text-gray-300 mb-3">
                                    The GW2 API does not currently report ownership of <span className="text-gray-100 font-medium">Living World Seasons</span>, <span className="text-gray-100 font-medium">The Icebrood Saga</span>, or <span className="text-gray-100 font-medium">Visions of Eternity</span>. Use the <Settings size={12} className="inline text-gw2-gold" /> gear icon in the Story Completion Overview to indicate which of these you own.
                                </p>
                                <p className="text-sm text-gray-300 mb-4">
                                    Quest progress reflects all quests the API has ever recorded as completed, including from restarted stories or quests completed in another player's story instance. Progress may not always match your in-game journal and will correct itself as you replay through those quests.
                                </p>
                                <button onClick={() => setShowAccessInfo(false)}
                                    className="w-full px-4 py-2 rounded-lg border border-stone-700 text-gray-400 text-sm hover:text-white hover:border-stone-600 transition-colors">
                                    Close
                                </button>
                            </div>
                        </div>
                    )}

                    {showStaleBanner && !loading && data && (
                        <div className="bg-gw2-gold-dark/20 border-b border-gw2-gold-dark/40">
                            <div className="max-w-4xl mx-auto px-4 py-2.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                                <p className="text-sm text-gray-300 text-center sm:text-left">
                                    Your story data is from <span className="text-gw2-gold-light font-medium">{staleText}</span> and may be outdated.
                                </p>
                                <div className="flex items-center justify-center sm:justify-end gap-3">
                                    <button
                                        onClick={() => { setShowStaleBanner(false); handleRefresh(); }}
                                        className="text-sm font-medium text-gw2-gold hover:text-gw2-gold-light transition-colors flex items-center gap-1.5"
                                    >
                                        <RefreshCw size={14} /> Refresh now
                                    </button>
                                    <button
                                        onClick={() => setShowStaleBanner(false)}
                                        className="text-gray-500 hover:text-gray-300 transition-colors text-xs"
                                    >
                                        Dismiss
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Content */}
                    <div className="max-w-4xl mx-auto px-4 py-8">
                        {loading && !data ? (
                            <div className="flex flex-col items-center justify-center py-20">
                                <Loader2 className="animate-spin text-gw2-gold w-12 h-12 mb-6" />
                                <div className="w-56 sm:w-72 mb-4">
                                    <ProgressBar 
                                        current={loadProgress.current} 
                                        total={loadProgress.total} 
                                        colorClass="bg-gw2-gold" 
                                    />
                                </div>
                                <p className="text-gray-300 text-sm font-medium">{status}</p>
                                <p className="text-gray-600 text-xs mt-1">
                                    {Math.round((loadProgress.current / loadProgress.total) * 100)}%
                                </p>
                                {subtokenSlow && (
                                    <div className="mt-4 text-center">
                                        <p className="text-yellow-400 text-sm mb-3">gw2.me is taking longer than expected to respond...</p>
                                        <button onClick={logout} className="text-sm text-gray-400 hover:text-white border border-stone-700 hover:border-stone-600 px-4 py-2 rounded-lg transition-colors">
                                            Return to login &amp; use API key instead
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : data ? (
                            <div className="space-y-6">
                                {(() => { const isSingleChar = Object.keys(charInfo).length === 1; return (<>
                                <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-4">
                                    <h2 className="text-xl sm:text-2xl font-bold font-display">{accountName ? `${accountName}'s Story Journal` : 'Story Journal'}</h2>
                                    {!isSingleChar && (
                                    <div className="flex items-center gap-2 sm:gap-3">
                                        <div className="flex bg-stone-800 rounded-lg p-0.5">
                                            <button
                                                onClick={() => setViewMode('season')}
                                                className={`px-3 py-1 text-sm rounded-md transition-colors ${viewMode === 'season' ? 'bg-gw2-gold-dark text-white' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                By Story
                                            </button>
                                            <button
                                                onClick={() => setViewMode('character')}
                                                className={`px-3 py-1 text-sm rounded-md transition-colors ${viewMode === 'character' ? 'bg-gw2-gold-dark text-white' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                By Character
                                            </button>
                                        </div>
                                        {viewMode === 'character' && (
                                            <select value={charSort} onChange={e => setCharSort(e.target.value)}
                                                className="bg-stone-800 text-sm text-gray-300 rounded-md px-2 py-1 border border-stone-700 focus:border-gw2-gold-dark focus:outline-none">
                                                <option value="progress">Sort: Progress</option>
                                                <option value="name">Sort: Name</option>
                                                <option value="level">Sort: Level</option>
                                                <option value="profession">Sort: Profession</option>
                                            </select>
                                        )}
                                    </div>
                                    )}
                                </div>

                                <AccountSummary data={visibleData} onNavigate={navigateTo} ownedStories={ownedStories} onToggleOwnership={toggleStoryOwnership} />
                                <HeroRecommendation data={visibleData} charInfo={charInfo} showPips={showPips} />
                                <div className="border-t border-stone-800 my-6"></div>

                                {!isSingleChar && (
                                    <div className="flex justify-end gap-2 mb-3">
                                        <button
                                            onClick={() => setExpandAllSignal({ expanded: true, v: Date.now() })}
                                            className="flex items-center gap-1 text-xs text-gray-400 hover:text-gw2-gold-light transition-colors px-2 py-1 rounded hover:bg-stone-800"
                                        >
                                            <ChevronDown size={14} /> Expand All
                                        </button>
                                        <button
                                            onClick={() => setExpandAllSignal({ expanded: false, v: Date.now() })}
                                            className="flex items-center gap-1 text-xs text-gray-400 hover:text-gw2-gold-light transition-colors px-2 py-1 rounded hover:bg-stone-800"
                                        >
                                            <ChevronUp size={14} /> Collapse All
                                        </button>
                                    </div>
                                )}

                                {isSingleChar ? (
                                    <CharacterCard
                                        charName={Object.keys(charInfo)[0]}
                                        charInfo={charInfo}
                                        seasons={visibleData}
                                        isHidden={false}
                                        onNavigate={navigateTo}
                                        defaultExpanded={true}
                                        showPips={showPips}
                                    />
                                ) : (<>
                                {viewMode === 'season' && hiddenChars.size > 0 && (
                                    <div className="flex items-center justify-center gap-2 mb-4 text-sm text-gray-500">
                                        <EyeOff size={14} />
                                        <span>{hiddenChars.size} character{hiddenChars.size > 1 ? 's' : ''} hidden</span>
                                        <span className="text-gray-700">·</span>
                                        <button
                                            onClick={() => setViewMode('character')}
                                            className="text-gw2-gold-light hover:text-gw2-gold transition-colors"
                                        >
                                            Manage
                                        </button>
                                    </div>
                                )}

                                {viewMode === 'season' ? (
                                    visibleData.map(season => (
                                        <SeasonCard 
                                            key={season.id} 
                                            season={season} 
                                            characters={season.charData}
                                            recommendedChar={season.recommendation}
                                            charInfo={charInfo}
                                            onNavigate={navigateTo}
                                            focusId={navigateTarget?.type === 'season' ? navigateTarget.id : null}
                                            onNavigated={() => setNavigateTarget(null)}
                                            showPips={showPips}
                                            expandAllSignal={expandAllSignal}
                                        />
                                    ))
                                ) : (
                                    Object.keys(charInfo)
                                        .sort((a, b) => {
                                            if (charSort === 'name') return a.localeCompare(b);
                                            if (charSort === 'level') { const ld = (charInfo[b]?.level || 0) - (charInfo[a]?.level || 0); if (ld !== 0) return ld; const prog = (name) => visibleData.reduce((s, season) => s + (season.charData[name]?.progress || 0), 0); return prog(b) - prog(a); }
                                            if (charSort === 'profession') return (charInfo[a]?.profession || '').localeCompare(charInfo[b]?.profession || '') || a.localeCompare(b);
                                            const prog = (name) => visibleData.reduce((s, season) => s + (season.charData[name]?.progress || 0), 0);
                                            return prog(b) - prog(a);
                                        })
                                        .map(name => (
                                            <CharacterCard
                                                key={name}
                                                charName={name}
                                                charInfo={charInfo}
                                                seasons={visibleData}
                                                isHidden={hiddenChars.has(name)}
                                                onToggleVisibility={toggleCharVisibility}
                                                onNavigate={navigateTo}
                                                focusId={navigateTarget?.type === 'character' ? navigateTarget.id : null}
                                                onNavigated={() => setNavigateTarget(null)}
                                                showPips={showPips}
                                                expandAllSignal={expandAllSignal}
                                            />
                                        ))
                                )}
                                </>)}</>); })()}
                            </div>
                        ) : null}
                    </div>
                    <footer className="text-center text-xs text-gray-600 py-8">
                        <a href="privacy.html" className="hover:text-gray-400 transition-colors">Privacy Policy</a>
                        <span className="mx-1.5">·</span>
                        <a href="tos.html" className="hover:text-gray-400 transition-colors">Terms of Service</a>
                        <span className="mx-1.5">·</span>
                        <a href="https://github.com/MattyGroch/gw2-storytracker" target="_blank" rel="noopener noreferrer" className="hover:text-gray-400 transition-colors">GitHub</a>
                        <span className="mx-1.5">·</span>
                        <a href="https://gw2pathfinder.com" target="_blank" rel="noopener noreferrer" className="hover:text-gray-400 transition-colors">GW2 Pathfinder</a>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
    </script>
</body>
</html>
