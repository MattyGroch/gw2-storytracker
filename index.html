<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GW2 Story Tracker & Recommender</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gw2: {
                            gold: '#c8a84e',
                            'gold-light': '#dcc075',
                            'gold-dark': '#8a6b2d',
                        }
                    },
                    fontFamily: {
                        display: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #13110f;
            color: #e8e0d6;
        }
        .gw2-gradient {
            background: linear-gradient(135deg, #c8a84e 0%, #8a6b2d 100%);
        }
        .card-bg {
            background-color: #1e1b17;
        }
        .progress-bar-bg {
            background-color: #3a352e;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #13110f; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4a443a; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b6355; 
        }
        /* Rotate animation for Loader2 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Icons (Inline to avoid CDN Dependency Issues) ---
        const IconBase = ({ children, size = 24, className = "", ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
                {...props}
            >
                {children}
            </svg>
        );

        const Scroll = (props) => (
            <IconBase {...props}>
                <path d="M8 21h12a2 2 0 0 0 2-2v-2a10 10 0 0 0-10-10A10 10 0 0 0 2 17v2a2 2 0 0 0 2 2h4" />
                <path d="M19 17V5a2 2 0 0 0-2-2H4" />
            </IconBase>
        );
        const BookOpen = (props) => (
            <IconBase {...props}>
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </IconBase>
        );
        const Shield = (props) => (
            <IconBase {...props}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </IconBase>
        );
        const User = (props) => (
            <IconBase {...props}>
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </IconBase>
        );
        const AlertCircle = (props) => (
            <IconBase {...props}>
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </IconBase>
        );
        const CheckCircle2 = (props) => (
            <IconBase {...props}>
                <circle cx="12" cy="12" r="10" />
                <path d="m9 12 2 2 4-4" />
            </IconBase>
        );
        const PlayCircle = (props) => (
            <IconBase {...props}>
                <circle cx="12" cy="12" r="10" />
                <polygon points="10 8 16 12 10 16 10 8" />
            </IconBase>
        );
        const Loader2 = (props) => (
            <IconBase {...props}>
                <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </IconBase>
        );
        const ChevronDown = (props) => (
            <IconBase {...props}>
                <path d="m6 9 6 6 6-6" />
            </IconBase>
        );
        const ChevronUp = (props) => (
            <IconBase {...props}>
                <path d="m18 15-6-6-6 6" />
            </IconBase>
        );
        const LogOut = (props) => (
            <IconBase {...props}>
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </IconBase>
        );
        const RefreshCw = (props) => (
            <IconBase {...props}>
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                <path d="M8 16H3v5" />
            </IconBase>
        );

        const Lock = (props) => (
            <IconBase {...props}>
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </IconBase>
        );

        // --- API & Helper Functions ---

        const API_BASE = 'https://api.guildwars2.com/v2';
        const MY_STORY_SEASON_ID = '215AAA0F-CDAC-4F93-86DA-C155A99B5784';
        const MY_STORY_QUESTS_PER_PATH = 49;
        const CACHE_KEY = 'gw2_session_cache';

        const EXPANSION_MAP = {
            'Heart of Thorns': 'HeartOfThorns',
            'Path of Fire': 'PathOfFire',
            'End of Dragons': 'EndOfDragons',
            'Secrets of the Obscure': 'SecretsOfTheObscure',
            'Janthir Wilds': 'JanthirWilds',
        };

        function formatRelativeTime(ts) {
            const sec = Math.floor((Date.now() - ts) / 1000);
            if (sec < 60) return 'just now';
            const min = Math.floor(sec / 60);
            if (min < 60) return `${min}m ago`;
            const hrs = Math.floor(min / 60);
            if (hrs < 24) return `${hrs}h ago`;
            return `${Math.floor(hrs / 24)}d ago`;
        }

        // --- Components ---

        const ProgressBar = ({ current, total, colorClass = "bg-gw2-gold" }) => {
            const percentage = Math.min(100, Math.max(0, (current / total) * 100));
            return (
                <div className="w-full h-2 rounded-full progress-bar-bg overflow-hidden">
                    <div 
                        className={`h-full ${colorClass} transition-all duration-500`} 
                        style={{ width: `${percentage}%` }}
                    />
                </div>
            );
        };

        const CharacterRow = ({ charName, progress, total, unit = "Chapters", isRecommended, charInfo }) => {
            const percentage = Math.round((progress / total) * 100);
            const isComplete = progress >= total;
            const info = charInfo?.[charName];

            return (
                <div className={`flex items-center justify-between p-2 rounded ${isRecommended ? 'bg-gw2-gold-dark/15 border border-gw2-gold-dark/40' : 'hover:bg-white/5'}`}>
                    <div className="flex items-center gap-3 flex-1">
                        <User size={16} className={isRecommended ? "text-gw2-gold-light" : "text-gray-500"} />
                        <div className="flex flex-col">
                            <span className={`text-sm font-medium ${isRecommended ? 'text-amber-200' : 'text-gray-300'}`}>
                                {charName}
                                {info && <span className="ml-1.5 text-xs text-gray-500 font-normal">{info.race} {info.profession}</span>}
                                {isRecommended && <span className="ml-2 text-xs bg-gw2-gold-dark text-amber-100 px-1.5 py-0.5 rounded">Recommended</span>}
                            </span>
                            <span className="text-xs text-gray-500">
                                {progress} / {total} {unit} ({percentage}%)
                            </span>
                        </div>
                    </div>
                    <div className="w-24 ml-4">
                        <ProgressBar current={progress} total={total} colorClass={isComplete ? "bg-green-500" : (isRecommended ? "bg-gw2-gold" : "bg-gray-500")} />
                    </div>
                </div>
            );
        };

        const SeasonCard = ({ season, characters, recommendedChar, charInfo }) => {
            const [expanded, setExpanded] = useState(false);
            
            // Sort characters: Recommended first, then by progress desc
            const sortedChars = useMemo(() => {
                return Object.entries(characters)
                    .map(([name, data]) => ({ name, ...data }))
                    .sort((a, b) => {
                        if (a.name === recommendedChar?.name) return -1;
                        if (b.name === recommendedChar?.name) return 1;
                        return b.progress - a.progress;
                    });
            }, [characters, recommendedChar]);

            const isOwned = season.owned !== false;
            const isAllComplete = isOwned && sortedChars.every(c => c.progress >= c.total);
            const isCompletedByAny = isOwned && sortedChars.some(c => c.progress >= c.total);

            return (
                <div className={`card-bg rounded-lg border border-stone-800 overflow-hidden mb-4 shadow-lg ${!isOwned ? 'opacity-40' : ''} ${isOwned && recommendedChar ? 'ring-1 ring-gw2-gold-dark/60' : ''}`}>
                    {/* Header */}
                    <div className="p-4 flex items-center justify-between bg-gradient-to-r from-stone-800 to-transparent">
                        <div className="flex items-center gap-3">
                            <BookOpen className={isOwned ? "text-gw2-gold" : "text-gray-600"} size={24} />
                            <div>
                                <h3 className="text-lg font-bold text-gray-100 font-display">{season.name}</h3>
                                <p className="text-xs text-gray-400">
                                    {season.totalStories} {season.unit || 'Chapters'}
                                    {isCompletedByAny && !isAllComplete && (
                                        <span className="ml-2 text-green-500 inline-flex items-center">
                                            <CheckCircle2 size={12} className="mr-0.5" /> Cleared
                                        </span>
                                    )}
                                </p>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            {!isOwned ? (
                                <span className="flex items-center text-gray-500 text-sm italic">
                                    <Lock size={14} className="mr-1.5" /> Requires {season.requiredExpansion}
                                </span>
                            ) : isAllComplete ? (
                                <span className="flex items-center text-green-500 text-sm font-medium bg-green-900/20 px-3 py-1 rounded-full">
                                    <CheckCircle2 size={16} className="mr-1.5" /> Complete
                                </span>
                            ) : recommendedChar ? (
                                <div className="text-right hidden sm:block">
                                    <div className="text-xs text-gray-400 uppercase tracking-wider">Next Up</div>
                                    <div className="text-gw2-gold-light font-bold flex items-center justify-end">
                                        {recommendedChar.name} <PlayCircle size={14} className="ml-1" />
                                    </div>
                                </div>
                            ) : (
                                <span className="text-gray-500 text-sm italic">No active progress</span>
                            )}
                            {isOwned && (
                                <button 
                                    onClick={() => setExpanded(!expanded)}
                                    className="p-1 hover:bg-stone-700 rounded transition-colors"
                                >
                                    {expanded ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Content */}
                    {isOwned && (expanded || recommendedChar) && (
                        <div className="p-4 border-t border-stone-800 space-y-2">
                             {!expanded && recommendedChar && (
                                <CharacterRow 
                                    charName={recommendedChar.name} 
                                    progress={recommendedChar.progress} 
                                    total={recommendedChar.total} 
                                    unit={season.unit}
                                    isRecommended={true}
                                    charInfo={charInfo}
                                />
                             )}

                             {expanded && sortedChars.length > 0 && (
                                <div className="space-y-2">
                                    {sortedChars.map(char => (
                                        <CharacterRow 
                                            key={char.name}
                                            charName={char.name}
                                            progress={char.progress}
                                            total={char.total}
                                            unit={season.unit}
                                            isRecommended={char.name === recommendedChar?.name}
                                            charInfo={charInfo}
                                        />
                                    ))}
                                </div>
                             )}
                             
                             {expanded && sortedChars.length === 0 && (
                                 <div className="text-center text-gray-500 py-2">No characters found.</div>
                             )}
                        </div>
                    )}
                </div>
            );
        };

        const AccountSummary = ({ data }) => {
            const stats = useMemo(() => {
                const charNames = Object.keys(data[0]?.charData || {});
                const owned = data.filter(s => s.owned !== false);
                let storiesCompleted = 0;
                let totalProgress = 0;
                let totalPossible = 0;

                owned.forEach(season => {
                    if (Object.values(season.charData).some(c => c.progress >= c.total)) storiesCompleted++;
                    Object.values(season.charData).forEach(c => {
                        totalProgress += c.progress;
                        totalPossible += c.total;
                    });
                });

                return {
                    totalChars: charNames.length,
                    storiesCompleted,
                    totalStories: owned.length,
                    overallPct: totalPossible > 0 ? Math.round((totalProgress / totalPossible) * 100) : 0
                };
            }, [data]);

            return (
                <div className="grid grid-cols-3 gap-4 mb-6">
                    <div className="card-bg rounded-lg p-4 border border-gw2-gold-dark/30 text-center">
                        <p className="text-2xl font-bold text-gw2-gold-light font-display">{stats.totalChars}</p>
                        <p className="text-xs text-gray-400 mt-1 uppercase tracking-wider">Characters</p>
                    </div>
                    <div className="card-bg rounded-lg p-4 border border-gw2-gold-dark/30 text-center">
                        <p className="text-2xl font-bold text-gray-100 font-display">
                            <span className="text-green-400">{stats.storiesCompleted}</span> / {stats.totalStories}
                        </p>
                        <p className="text-xs text-gray-400 mt-1 uppercase tracking-wider">Stories Completed</p>
                    </div>
                    <div className="card-bg rounded-lg p-4 border border-gw2-gold-dark/30 text-center">
                        <p className="text-2xl font-bold text-gw2-gold-light font-display">{stats.overallPct}%</p>
                        <p className="text-xs text-gray-400 mt-1 uppercase tracking-wider">Overall Completion</p>
                    </div>
                </div>
            );
        };

        const HeroRecommendation = ({ data, charInfo }) => {
            const best = useMemo(() => {
                let top = null;
                let topPct = -1;

                data.filter(s => s.owned !== false).forEach(season => {
                    Object.entries(season.charData).forEach(([name, d]) => {
                        if (d.progress > 0 && d.total > 0 && d.progress < d.total) {
                            const pct = d.progress / d.total;
                            if (pct > topPct || (pct === topPct && d.progress > (top?.progress || 0))) {
                                topPct = pct;
                                top = {
                                    charName: name,
                                    seasonName: season.name,
                                    progress: d.progress,
                                    total: d.total,
                                    unit: season.unit,
                                    pct: Math.round(pct * 100)
                                };
                            }
                        }
                    });
                });

                return top;
            }, [data]);

            if (!best) return null;
            const info = charInfo?.[best.charName];

            return (
                <div className="card-bg rounded-lg border border-gw2-gold-dark/40 p-6 mb-6 bg-gradient-to-r from-gw2-gold-dark/10 to-transparent">
                    <div className="flex items-center gap-2 mb-3">
                        <PlayCircle className="text-gw2-gold" size={18} />
                        <span className="text-xs text-gw2-gold uppercase tracking-wider font-bold">Continue Your Journey</span>
                    </div>
                    <div className="flex items-center justify-between">
                        <div>
                            <h3 className="text-xl font-bold text-gray-100 font-display">{best.seasonName}</h3>
                            <p className="text-sm text-gray-400 mt-1">
                                {best.charName}
                                {info && <span className="text-gray-500"> · {info.race} {info.profession}</span>}
                                <span className="text-gray-600"> — {best.progress} / {best.total} {best.unit}</span>
                            </p>
                        </div>
                        <p className="text-3xl font-bold text-gw2-gold-light font-display">{best.pct}%</p>
                    </div>
                    <div className="mt-4">
                        <ProgressBar current={best.progress} total={best.total} colorClass="bg-gw2-gold" />
                    </div>
                </div>
            );
        };

        const CharacterCard = ({ charName, charInfo, seasons }) => {
            const [expanded, setExpanded] = useState(false);
            const info = charInfo?.[charName];

            const seasonProgress = useMemo(() => {
                return seasons
                    .filter(s => s.owned !== false)
                    .map(season => {
                        const cd = season.charData[charName];
                        return {
                            name: season.name,
                            id: season.id,
                            progress: cd?.progress || 0,
                            total: cd?.total || 0,
                            unit: season.unit || 'Chapters'
                        };
                    })
                    .filter(s => s.total > 0);
            }, [seasons, charName]);

            const completedSeasons = seasonProgress.filter(s => s.progress >= s.total).length;
            const totalSeasons = seasonProgress.length;

            return (
                <div className="card-bg rounded-lg border border-stone-800 overflow-hidden mb-4 shadow-lg">
                    <div className="p-4 flex items-center justify-between bg-gradient-to-r from-stone-800 to-transparent">
                        <div className="flex items-center gap-3">
                            <User className="text-gw2-gold" size={24} />
                            <div>
                                <h3 className="text-lg font-bold text-gray-100 font-display">
                                    {charName}
                                    {info && <span className="ml-2 text-sm text-gray-400 font-normal font-sans">{info.race} {info.profession}</span>}
                                </h3>
                                <p className="text-xs text-gray-400">
                                    <span className="text-green-400">{completedSeasons}</span> / {totalSeasons} Stories Completed
                                </p>
                            </div>
                        </div>
                        <button
                            onClick={() => setExpanded(!expanded)}
                            className="p-1 hover:bg-stone-700 rounded transition-colors"
                        >
                            {expanded ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
                        </button>
                    </div>
                    {expanded && (
                        <div className="p-4 border-t border-stone-800 space-y-2">
                            {seasonProgress.map(sp => {
                                const pct = Math.round((sp.progress / sp.total) * 100);
                                const isComplete = sp.progress >= sp.total;
                                const hasProgress = sp.progress > 0;
                                return (
                                    <div key={sp.id} className="flex items-center justify-between p-2 rounded hover:bg-white/5">
                                        <div className="flex items-center gap-3 flex-1">
                                            <BookOpen size={16} className={isComplete ? "text-green-500" : hasProgress ? "text-gw2-gold-light" : "text-gray-600"} />
                                            <div className="flex flex-col">
                                                <span className={`text-sm font-medium ${isComplete ? 'text-green-400' : 'text-gray-300'}`}>{sp.name}</span>
                                                <span className="text-xs text-gray-500">{sp.progress} / {sp.total} {sp.unit} ({pct}%)</span>
                                            </div>
                                        </div>
                                        <div className="w-24 ml-4">
                                            <ProgressBar current={sp.progress} total={sp.total} colorClass={isComplete ? "bg-green-500" : hasProgress ? "bg-gw2-gold" : "bg-gray-600"} />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gw2_api_key') || '');
            const [hasAccess, setHasAccess] = useState(!!localStorage.getItem('gw2_api_key'));
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [status, setStatus] = useState('');
            const [loadProgress, setLoadProgress] = useState({ step: 0, total: 1 });
            const [data, setData] = useState(null);
            const [charInfo, setCharInfo] = useState({});
            const [cachedAt, setCachedAt] = useState(null);
            const [staleText, setStaleText] = useState('');
            const [viewMode, setViewMode] = useState('season');
            const [accountName, setAccountName] = useState('');

            const fetchData = useCallback(async (key) => {
                setLoading(true);
                setError(null);
                try {
                    setLoadProgress({ current: 0, total: 1 });
                    setStatus('Loading game data and quest database...');
                    const [seasonsData, storiesData, questToStoryMap] = await Promise.all([
                        fetch(`${API_BASE}/stories/seasons?ids=all`).then(r => r.json()),
                        fetch(`${API_BASE}/stories?ids=all`).then(r => r.json()),
                        fetch('quest-data.json').then(r => r.json())
                    ]);

                    const seasonMap = {};
                    seasonsData.sort((a, b) => a.order - b.order).forEach(s => {
                        seasonMap[s.id] = { ...s, stories: [] };
                    });

                    const storyToSeasonMap = {};
                    storiesData.sort((a, b) => a.order - b.order).forEach(story => {
                        if (seasonMap[story.season]) {
                            seasonMap[story.season].stories.push(story);
                            storyToSeasonMap[story.id] = story.season;
                        }
                    });

                    setLoadProgress({ current: 1, total: 3 });
                    setStatus('Fetching account data...');
                    const [chars, accountData] = await Promise.all([
                        fetch(`${API_BASE}/characters?access_token=${key}`).then(r => r.json()),
                        fetch(`${API_BASE}/account?access_token=${key}`)
                            .then(r => r.ok ? r.json() : null)
                            .catch(() => null)
                    ]);
                    const accountAccess = accountData?.access || [];
                    const rawName = accountData?.name || '';
                    const displayName = rawName.replace(/\.\d+$/, '');

                    const totalUnits = 2 + chars.length + 1;
                    setLoadProgress({ current: 2, total: totalUnits });

                    const charQuests = {};
                    const charInfoMap = {};
                    const batchSize = 5;

                    for (let i = 0; i < chars.length; i += batchSize) {
                        const scannedSoFar = Math.min(i + batchSize, chars.length);
                        setLoadProgress({ current: 2 + scannedSoFar, total: totalUnits });
                        setStatus(`Scanning characters (${scannedSoFar} / ${chars.length})...`);

                        const batch = chars.slice(i, i + batchSize);
                        const promises = batch.map(async (name) => {
                            const safeName = encodeURIComponent(name);
                            const [questsRes, coreRes] = await Promise.all([
                                fetch(`${API_BASE}/characters/${safeName}/quests?access_token=${key}`),
                                fetch(`${API_BASE}/characters/${safeName}/core?access_token=${key}`)
                            ]);
                            if(questsRes.ok) {
                                charQuests[name] = await questsRes.json();
                            } else {
                                console.warn(`Could not fetch quests for ${name}`);
                                charQuests[name] = [];
                            }
                            if(coreRes.ok) {
                                const coreData = await coreRes.json();
                                charInfoMap[name] = { race: coreData.race, profession: coreData.profession };
                            }
                        });
                        await Promise.all(promises);
                        await new Promise(r => setTimeout(r, 100));
                    }

                    setLoadProgress({ current: totalUnits, total: totalUnits });
                    setStatus('Calculating recommendations...');

                    const storyQuestCounts = {};
                    Object.values(questToStoryMap).forEach(storyId => {
                        storyQuestCounts[storyId] = (storyQuestCounts[storyId] || 0) + 1;
                    });

                    const processedSeasons = Object.values(seasonMap).map(season => {
                        const charProgressMap = {};
                        const myStory = season.id === MY_STORY_SEASON_ID;
                        const seasonTotalQuests = season.stories.reduce((sum, s) =>
                            sum + (storyQuestCounts[s.id] || 0), 0);
                        const useQuestLevel = seasonTotalQuests > 0;

                        chars.forEach(charName => {
                            const race = charInfoMap[charName]?.race;
                            const applicableStories = season.stories.filter(s =>
                                !s.races || s.races.length === 0 || s.races.includes(race)
                            );
                            const applicableStoryIds = new Set(applicableStories.map(s => s.id));
                            const completedQuests = charQuests[charName] || [];

                            const completedStoryIdsInSeason = new Set();
                            let completedQuestCount = 0;

                            completedQuests.forEach(qId => {
                                const storyId = questToStoryMap[qId];
                                if (storyId && applicableStoryIds.has(storyId)) {
                                    completedStoryIdsInSeason.add(storyId);
                                    completedQuestCount++;
                                }
                            });

                            if (useQuestLevel) {
                                const totalQuests = myStory
                                    ? MY_STORY_QUESTS_PER_PATH
                                    : applicableStories.reduce((sum, s) => sum + (storyQuestCounts[s.id] || 0), 0);
                                charProgressMap[charName] = {
                                    progress: completedQuestCount,
                                    total: totalQuests,
                                    completedIds: completedStoryIdsInSeason
                                };
                            } else {
                                charProgressMap[charName] = {
                                    progress: completedStoryIdsInSeason.size,
                                    total: applicableStories.length,
                                    completedIds: completedStoryIdsInSeason
                                };
                            }
                        });

                        let bestCandidate = null;
                        let maxProgress = -1;

                        Object.entries(charProgressMap).forEach(([name, data]) => {
                            const p = data.progress;
                            const total = data.total;

                            if (total === 0) return;

                            if (p > 0 && p < total) {
                                if (p > maxProgress) {
                                    maxProgress = p;
                                    bestCandidate = { name, progress: p, total };
                                }
                            }
                        });

                        const uniqueOrders = new Set(season.stories.map(s => s.order));
                        const displayTotal = useQuestLevel
                            ? (myStory ? MY_STORY_QUESTS_PER_PATH : seasonTotalQuests)
                            : uniqueOrders.size;

                        const requiredAccess = EXPANSION_MAP[season.name];
                        const owned = !requiredAccess || accountAccess.includes(requiredAccess);

                        return {
                            ...season,
                            totalStories: displayTotal,
                            unit: useQuestLevel ? 'Quests' : 'Chapters',
                            charData: charProgressMap,
                            recommendation: owned ? bestCandidate : null,
                            owned,
                            requiredExpansion: requiredAccess && !owned ? season.name : null
                        };
                    });

                    const validSeasons = processedSeasons.filter(s => s.totalStories > 0);

                    const cacheableSeasons = validSeasons.map(s => ({
                        ...s,
                        stories: undefined,
                        charData: Object.fromEntries(
                            Object.entries(s.charData).map(([n, d]) => [n, { progress: d.progress, total: d.total }])
                        )
                    }));

                    setData(cacheableSeasons);
                    setCharInfo(charInfoMap);
                    setAccountName(displayName);
                    const now = Date.now();
                    setCachedAt(now);
                    setLoading(false);

                    try {
                        sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                            data: cacheableSeasons,
                            charInfo: charInfoMap,
                            accountName: displayName,
                            cachedAt: now
                        }));
                    } catch (e) { console.warn('Cache save failed', e); }

                } catch (err) {
                    console.error(err);
                    setError("Failed to fetch or parse game data. " + err.message);
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                if (hasAccess && apiKey && !data) {
                    try {
                        const raw = sessionStorage.getItem(CACHE_KEY);
                        if (raw) {
                            const cached = JSON.parse(raw);
                            setData(cached.data);
                            setCharInfo(cached.charInfo);
                            setAccountName(cached.accountName || '');
                            setCachedAt(cached.cachedAt);
                            return;
                        }
                    } catch (e) { console.warn('Cache load failed', e); }
                    fetchData(apiKey);
                }
            }, []);

            useEffect(() => {
                if (!cachedAt) return;
                const update = () => setStaleText(formatRelativeTime(cachedAt));
                update();
                const id = setInterval(update, 30000);
                return () => clearInterval(id);
            }, [cachedAt]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError(null);
                setStatus('Validating key...');

                try {
                    const tokenRes = await fetch(`${API_BASE}/tokeninfo?access_token=${apiKey}`);
                    if (!tokenRes.ok) throw new Error("Invalid API Key");
                    const tokenInfo = await tokenRes.json();
                    
                    const permissions = tokenInfo.permissions;
                    const required = ['account', 'characters', 'progression'];
                    const missing = required.filter(p => !permissions.includes(p));
                    if (missing.length > 0) {
                        throw new Error(`API Key needs '${missing.join("', '")}' scopes.`);
                    }

                    localStorage.setItem('gw2_api_key', apiKey);
                    setHasAccess(true);
                    await fetchData(apiKey);
                } catch (err) {
                    setError(err.message);
                    setLoading(false);
                }
            };

            const logout = () => {
                localStorage.removeItem('gw2_api_key');
                sessionStorage.removeItem(CACHE_KEY);
                setApiKey('');
                setHasAccess(false);
                setData(null);
                setCharInfo({});
                setAccountName('');
                setCachedAt(null);
            };

            if (!hasAccess) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="card-bg w-full max-w-md p-8 rounded-xl shadow-2xl border border-stone-800">
                            <div className="flex justify-center mb-6">
                                <Shield className="text-gw2-gold w-16 h-16" />
                            </div>
                            <h1 className="text-3xl font-bold text-center mb-2 font-display">Guild Wars 2 Story Tracker</h1>
                            <p className="text-gray-400 text-center mb-8">
                                Enter your Guild Wars 2 API Key to analyze your story progress across all characters.
                                {' '}Manage your existing API keys <a href="https://account.arena.net/applications" target="_blank" rel="noopener noreferrer" className="text-gw2-gold hover:text-gw2-gold-light transition-colors">here</a>.
                            </p>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-400 mb-1">API Key</label>
                                    <input 
                                        type="text" 
                                        value={apiKey}
                                        onChange={(e) => setApiKey(e.target.value)}
                                        className="w-full bg-black/30 border border-stone-700 rounded px-4 py-3 text-white focus:outline-none focus:border-gw2-gold transition-colors"
                                        placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXXXXXXXXXX"
                                    />
                                    <p className="text-xs text-gray-500 mt-2">
                                        <a href="https://account.arena.net/applications/create" target="_blank" rel="noopener noreferrer" className="text-gw2-gold hover:text-gw2-gold-light transition-colors">Create a new API key</a>
                                        <span className="mx-1.5">·</span>
                                        Required permissions: <span className="text-gray-300">account, characters, progression</span>
                                    </p>
                                </div>
                                
                                {error && (
                                    <div className="bg-red-900/20 border border-red-900/50 p-3 rounded flex items-start gap-2 text-red-200 text-sm">
                                        <AlertCircle size={16} className="mt-0.5 shrink-0" />
                                        <span>{error}</span>
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full gw2-gradient text-white font-bold py-3 rounded hover:opacity-90 transition-opacity flex justify-center items-center gap-2"
                                >
                                    {loading ? <Loader2 className="animate-spin" /> : "Load Account"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-12">
                    {/* Navbar */}
                    <nav className="card-bg border-b border-stone-800 sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <Shield className="text-gw2-gold" />
                                <span className="font-bold text-xl hidden sm:inline font-display">Guild Wars 2 Story Tracker</span>
                            </div>
                            <div className="flex items-center gap-4">
                                {staleText && !loading && (
                                    <span className="text-xs text-gray-500 hidden sm:inline">Data from {staleText}</span>
                                )}
                                <button
                                    onClick={() => fetchData(apiKey)}
                                    disabled={loading}
                                    className="text-gray-400 hover:text-white flex items-center gap-2 text-sm disabled:opacity-50 transition-colors"
                                >
                                    <RefreshCw size={16} className={loading ? "animate-spin" : ""} /> Refresh
                                </button>
                                <button 
                                    onClick={logout}
                                    className="text-gray-400 hover:text-white flex items-center gap-2 text-sm transition-colors"
                                >
                                    <LogOut size={16} /> Sign Out
                                </button>
                            </div>
                        </div>
                        {loading && data && (
                            <div className="max-w-4xl mx-auto px-4 pb-1">
                                <ProgressBar current={loadProgress.current} total={loadProgress.total} colorClass="bg-gw2-gold" />
                            </div>
                        )}
                    </nav>

                    {/* Main Content */}
                    <div className="max-w-4xl mx-auto px-4 py-8">
                        {loading && !data ? (
                            <div className="flex flex-col items-center justify-center py-20">
                                <Loader2 className="animate-spin text-gw2-gold w-12 h-12 mb-6" />
                                <div className="w-72 mb-4">
                                    <ProgressBar 
                                        current={loadProgress.current} 
                                        total={loadProgress.total} 
                                        colorClass="bg-gw2-gold" 
                                    />
                                </div>
                                <p className="text-gray-300 text-sm font-medium">{status}</p>
                                <p className="text-gray-600 text-xs mt-1">
                                    {Math.round((loadProgress.current / loadProgress.total) * 100)}%
                                </p>
                            </div>
                        ) : data ? (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-2xl font-bold font-display">{accountName ? `${accountName}'s Story Journal` : 'Story Journal'}</h2>
                                    <div className="flex items-center gap-3">
                                        <div className="flex bg-stone-800 rounded-lg p-0.5">
                                            <button
                                                onClick={() => setViewMode('season')}
                                                className={`px-3 py-1 text-sm rounded-md transition-colors ${viewMode === 'season' ? 'bg-gw2-gold-dark text-white' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                By Story
                                            </button>
                                            <button
                                                onClick={() => setViewMode('character')}
                                                className={`px-3 py-1 text-sm rounded-md transition-colors ${viewMode === 'character' ? 'bg-gw2-gold-dark text-white' : 'text-gray-400 hover:text-white'}`}
                                            >
                                                By Character
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <AccountSummary data={data} />
                                <HeroRecommendation data={data} charInfo={charInfo} />
                                <div className="border-t border-stone-800 my-6"></div>

                                {viewMode === 'season' ? (
                                    data.map(season => (
                                        <SeasonCard 
                                            key={season.id} 
                                            season={season} 
                                            characters={season.charData}
                                            recommendedChar={season.recommendation}
                                            charInfo={charInfo}
                                        />
                                    ))
                                ) : (
                                    Object.keys(charInfo)
                                        .sort((a, b) => {
                                            const prog = (name) => data.reduce((s, season) => s + (season.charData[name]?.progress || 0), 0);
                                            return prog(b) - prog(a);
                                        })
                                        .map(name => (
                                            <CharacterCard
                                                key={name}
                                                charName={name}
                                                charInfo={charInfo}
                                                seasons={data}
                                            />
                                        ))
                                )}
                            </div>
                        ) : null}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
